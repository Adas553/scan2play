name: Browser tests

# The browser tests of the DJ dashboard (src/test/browser/README.md): the REAL js/dashboard/*.js on the REAL rendered dashboard.html,
# in a headless Chrome, against a stand-in server. No database, no secrets: only Maven Central (for the build of the render test) and the Chrome that the runner image already has.
# They are not part of `mvnw test` (the unit tests); this is the one place where a machine runs them.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 from 2026-10-19, and this is the image the browser tests were seen green on.
    # Move to the newer image on purpose (change the label, run it by hand), not by surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Chrome that the runner has
        run: google-chrome --version

      # run.py copies the repo to the work directory and builds there (as it does on a developer's machine); --no-sandbox because a runner
      # may forbid the sandbox's user namespaces — the browser opens only pages of the stand-in on 127.0.0.1.
      - name: Run every scenario
        run: python src/test/browser/run.py --no-sandbox --work "$RUNNER_TEMP/scan2play-browser-tests"

      # What each scenario recorded (steps, expected and actual values, the requests): for a failure that cannot be reproduced at once.
      - name: Keep the verdicts of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-verdicts
          path: ${{ runner.temp }}/scan2play-browser-tests/target/browser-harness/results/
          if-no-files-found: ignore
          retention-days: 14
