name: Unit tests

# `mvnw test` without the database tests (*IT, db-tests.yml) — the command of CLAUDE.md. No database, no secrets, nothing but Maven Central. The browser tests are their own workflow (browser-tests.yml).

# Not for a change of the documentation alone (the owner, 2026-10-21: the Actions minutes of the month were at 90 %) — but AGENTS.md
# and its Copilot copy, which the first step compares. A later pattern wins over an earlier one.
# A push runs them on `main` only: that is what Railway deploys, after waiting for these checks. A change reaches `dev` by a pull
# request, which runs them on the same tree first — the push to `dev` that its merge makes ran them a second time for nothing
# (the review of 2026-10-21, O3).
on:
  push:
    branches: [main]
    paths: ['**', '!**.md', '!docs/**', 'AGENTS.md', '.github/copilot-instructions.md']
  pull_request:
    paths: ['**', '!**.md', '!docs/**', 'AGENTS.md', '.github/copilot-instructions.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Pinned like the browser tests' job (see there): ubuntu-latest becomes Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .github/copilot-instructions.md is AGENTS.md for GitHub Copilot, word for word after its two-line header and a blank line
      # (review 7.3: the copy had drifted). Both are committed with CRLF, hence tr.
      - name: The Copilot instructions are AGENTS.md
        run: diff <(tail -n +4 .github/copilot-instructions.md | tr -d '\r') <(tr -d '\r' < AGENTS.md)
        shell: bash

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw is committed without the executable bit, hence sh; the single quotes keep the shell away from the !
      # -Dtest replaces surefire's own patterns, so the database tests (*IT, db-tests.yml) are excluded by name too.
      - name: Unit tests
        run: sh mvnw -B -ntp test '-Dtest=!*IT'

      # Coverage is a report, not a gate (review 6.4): the totals and the packages in the run's summary, the HTML as an artifact.
      - name: Coverage summary
        run: python3 .github/scripts/coverage-summary.py target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      # The log needs a GitHub login; the annotations are public — the failed tests and their messages, readable by anyone.
      - name: Name the failed tests
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py target/surefire-reports

      # Which test failed and why, for a failure that cannot be reproduced at once.
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
