name: Database tests

# The tests on a real PostgreSQL (*IT, base class PostgresIntegrationTest): every migration on an empty database with Hibernate
# validation, the SQL of the guest queue, the votes under their lock with concurrent guests, the sessions. `mvnw verify -Pit`
# runs them alone (the unit tests are unit-tests.yml); they create and drop their own s2p_it_* database on the service below.
# PostgreSQL 18 — the version of the production database on Railway (image postgres-ssl:18) and of the developer's machine.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    # Pinned like the other jobs (see browser-tests.yml): ubuntu-latest becomes Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw is committed without the executable bit, hence sh
      - name: Database tests
        run: sh mvnw -B -ntp verify -Pit

      # The log needs a GitHub login; the annotations are public — the failed tests and their messages, readable by anyone.
      - name: Name the failed tests
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py target/failsafe-reports

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: db-test-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
