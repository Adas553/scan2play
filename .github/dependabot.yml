# Dependabot: security fixes only (review 6.4, the owner's choice 2026-10-01). open-pull-requests-limit: 0 turns the routine version
# updates off; the security updates are not limited by it and arrive as pull requests when a dependency has a known vulnerability.
# They need "Dependabot alerts" and "Dependabot security updates" switched on in the repository's Settings → Code security.
# A security PR targets the repository's default branch (target-branch applies to version updates only); each runs the three
# workflows like any other PR — bring the fix into dev too.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
