# ==============================================================================
# APPLICATION BASICS
# ==============================================================================
spring.application.name=scan2play
# Disable Docker Compose support (not needed in this project)
spring.docker.compose.enabled=false

# Messages i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Logging
logging.level.org.springframework.security=DEBUG

# ==============================================================================
# SERVER & NETWORK
# ==============================================================================
# The port the application will run on (default is 8080)
server.port=8080

# Async request timeout for Callable-based endpoints (AI eval + Spotify search)
spring.mvc.async.request-timeout=30000

# Instructs Spring Boot to use X-Forwarded-* headers from the proxy (Cloudflare/Nginx)
# Essential for correct redirect URI generation when behind a reverse proxy
server.forward-headers-strategy=FRAMEWORK

# Prevents incorrect redirects to localhost by disabling context-root redirection
server.tomcat.redirect-context-root=false

# ==============================================================================
# DATABASE (PostgreSQL)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/scan2play
spring.datasource.username=postgres
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
# Automatically create/update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Show SQL queries in console (very helpful for learning/debugging)
spring.jpa.show-sql=true

# ==============================================================================
# INTEGRATIONS: GOOGLE AI (GEMINI)
# ==============================================================================
google.ai.model-name=gemini-flash-latest
google.ai.api-key=${GOOGLE_AI_API_KEY}

# ==============================================================================
# INTEGRATIONS: SPOTIFY API (Custom Service)
# ==============================================================================
spotify.client-id=${SPOTIFY_CLIENT_ID}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}

# IMPORTANT: Tunneled URL for Cloudflare/Production environment
spotify.oauth.redirect-uri=https://www.scan2play.com.pl/spotify/callback

# ==============================================================================
# SCAN2PLAY BUSINESS LOGIC
# ==============================================================================
scan2play.guest-url=https://www.scan2play.com.pl/

# ==============================================================================
# SECURITY: OAUTH2 CLIENT REGISTRATION (SPOTIFY)
# ==============================================================================
spring.security.oauth2.client.registration.spotify.client-id=${SPOTIFY_CLIENT_ID}
spring.security.oauth2.client.registration.spotify.client-secret=${SPOTIFY_CLIENT_SECRET}

# Authorization Code Flow (most common & recommended for web apps)
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify.redirect-uri=https://www.scan2play.com.pl/login/oauth2/code/spotify
spring.security.oauth2.client.registration.spotify.scope=user-modify-playback-state,user-read-playback-state,user-read-private

# Spotify requires client_id + client_secret in Authorization: Basic header
spring.security.oauth2.client.registration.spotify.client-authentication-method=client_secret_basic

# ------------------------------------------------------------------------------
# OAUTH2 PROVIDER DETAILS: SPOTIFY
# ------------------------------------------------------------------------------
spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
# Endpoint used to fetch basic user profile
spring.security.oauth2.client.provider.spotify.user-info-uri=https://api.spotify.com/v1/me
# Field from response used as principal name
spring.security.oauth2.client.provider.spotify.user-name-attribute=id

# ==============================================================================
# SECURITY: OAUTH2 CLIENT REGISTRATION (GOOGLE / YOUTUBE)
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Recommended scopes:
# - openid: enables OpenID Connect
# - profile: access to basic profile info
# - email: access to user's email address
# - youtube: manage YouTube account (needed for playback control)
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/youtube

# Where Google redirects after successful login
# Must match EXACTLY what is registered in Google Cloud Console
spring.security.oauth2.client.registration.google.redirect-uri=https://www.scan2play.com.pl/login/oauth2/code/google
