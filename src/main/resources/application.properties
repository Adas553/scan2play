# ==============================================================================
# APPLICATION BASICS
# ==============================================================================
spring.application.name=scan2play
# Disable Docker Compose support (not needed in this project)
spring.docker.compose.enabled=false

# Messages i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Logging (set to DEBUG only for local troubleshooting)
logging.level.org.springframework.security=WARN

# ==============================================================================
# SERVER & NETWORK
# ==============================================================================
# The port the application will run on (default is 8080)
server.port=8080

# Async request timeout for Callable-based endpoints (AI eval + Spotify search)
spring.mvc.async.request-timeout=30000

# Instructs Spring Boot to use X-Forwarded-* headers from the proxy (Cloudflare/Nginx)
# Essential for correct redirect URI generation when behind a reverse proxy
server.forward-headers-strategy=FRAMEWORK

# Prevents incorrect redirects to localhost by disabling context-root redirection
server.tomcat.redirect-context-root=false

# Graceful shutdown: finish in-flight requests (AI eval Callable) before stopping
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Limit form POST size (prevents abuse on guest song request forms)
server.tomcat.max-http-form-post-size=10KB

# ==============================================================================
# DATABASE (PostgreSQL)
# ==============================================================================
# Railway's Postgres service exposes a complete DATABASE_URL in the format:
#   postgresql://user:password@host:port/database
# Individual PG* variables (PGHOST, PGPORT, etc.) are reference variables that
# point to ${{RAILWAY_PRIVATE_DOMAIN}} and do not resolve to concrete values
# when referenced cross-service. DATABASE_URL is the pre-built, fully-resolved
# connection string and is the only reliable source for the connection details.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:scan2play}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:1111}

logging.level.com.zaxxer.hikari=WARN

# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
# Validate schema on startup — the schema itself is managed by Flyway (see FLYWAY below),
# never by Hibernate (no auto-update).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Show SQL queries in console (enable for local debugging only)
spring.jpa.show-sql=false
# Disable OSIV \u2014 EntityManager must NOT be tied to servlet thread lifecycle.
# Our entities have no lazy relationships, and Callable<String> runs on async threads.
spring.jpa.open-in-view=false

# ==============================================================================
# FLYWAY (database migrations)
# ==============================================================================
# Every schema change is a new src/main/resources/db/migration/V<n>__<what>.sql file.
# NEVER edit a migration that has already been applied — add the next version instead.
# Flyway runs at startup, before Hibernate validates the schema, and uses spring.datasource.*.
#
# baseline-on-migrate: a database that already has tables but no flyway_schema_history
# (every database created before Flyway was adopted, incl. production) is recorded as
# version 1 = db/migration/V1__baseline.sql instead of failing; only V2+ are applied to it.
# An empty database gets V1 applied in full.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==============================================================================
# INTEGRATIONS: GOOGLE AI (GEMINI)
# ==============================================================================
# Gemini model for AI song evaluation.
# Pinned to a stable version \u2014 do NOT use *-latest aliases (quota/model can shift).
google.ai.model-name=gemini-2.5-flash-lite
google.ai.api-key=${GOOGLE_AI_API_KEY}

# ==============================================================================
# INTEGRATIONS: SPOTIFY API (Custom Service)
# ==============================================================================
spotify.client-id=${SPOTIFY_CLIENT_ID}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}

# IMPORTANT: Tunneled URL for Cloudflare/Production environment
spotify.oauth.redirect-uri=https://www.scan2play.com.pl/dj/spotify/callback

# ==============================================================================
# SCAN2PLAY BUSINESS LOGIC
# ==============================================================================
# Public base URL that guests open — it is encoded in the dashboard QR code and shown as "Your Party Link".
# Defaults to production. For local testing set the SCAN2PLAY_GUEST_URL environment variable (e.g. in the
# IntelliJ run configuration) to an address your phone can reach, i.e. this machine's LAN IP, NOT localhost:
#   SCAN2PLAY_GUEST_URL=http://192.168.1.23:8080/
# (the DJ dashboard itself still has to be opened via localhost — Google login redirects to localhost).
scan2play.guest-url=https://www.scan2play.com.pl/

# YouTube Data API v3 key (required for Auto-Pilot playback and for importing the fallback playlist)
# Default quota (Google "Quota costs" page, 2026-09): search.list has its own limit of 100 calls/day,
# all other endpoints share 10,000 units/day. Song lookups are cached (24h in memory, 30 days in the DB),
# so ~100 UNIQUE songs/day can be resolved. Playlist import costs 1 unit per 50 tracks from the general
# pool (see YouTubePlaylistClient) and does not touch the search limit.
youtube.api-key=${YOUTUBE_API_KEY:}

# ==============================================================================
# SECURITY: OAUTH2 CLIENT REGISTRATION (SPOTIFY)
# ==============================================================================
spring.security.oauth2.client.registration.spotify.client-id=${SPOTIFY_CLIENT_ID}
spring.security.oauth2.client.registration.spotify.client-secret=${SPOTIFY_CLIENT_SECRET}

# Authorization Code Flow (most common & recommended for web apps)
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
# {baseUrl} = the scheme+host+port of whichever request actually triggered the login
# (Spring's own default value for this property, spelled out so it's not a mystery).
# Works locally (http://localhost:8080/...) and in production alike, as long as the
# resulting URL is also registered as a Redirect URI in the Spotify Developer Dashboard.
# Do NOT hardcode this to the production domain (see PROJECT_CONTEXT.md Section 5.1 —
# this is the DJ *login* flow; the separate playback-connect flow in Section 5.3 has its
# own custom `spotify.oauth.redirect-uri` property below, with the same hardcoding, not
# fixed here since it needs an actual code change, not just a property).
spring.security.oauth2.client.registration.spotify.redirect-uri={baseUrl}/login/oauth2/code/spotify
spring.security.oauth2.client.registration.spotify.scope=user-modify-playback-state,user-read-playback-state,user-read-private

# Spotify requires client_id + client_secret in Authorization: Basic header
spring.security.oauth2.client.registration.spotify.client-authentication-method=client_secret_basic

# ------------------------------------------------------------------------------
# OAUTH2 PROVIDER DETAILS: SPOTIFY
# ------------------------------------------------------------------------------
spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
# Endpoint used to fetch basic user profile
spring.security.oauth2.client.provider.spotify.user-info-uri=https://api.spotify.com/v1/me
# Field from response used as principal name
spring.security.oauth2.client.provider.spotify.user-name-attribute=id

# ==============================================================================
# SECURITY: OAUTH2 CLIENT REGISTRATION (GOOGLE / YOUTUBE)
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Recommended scopes:
# - openid: enables OpenID Connect
# - profile: access to basic profile info
# - email: access to user's email address
# NOTE: YouTube Data API v3 uses an API key (not user OAuth token), so no youtube scope needed.
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where Google redirects after successful login.
# {baseUrl} = the scheme+host+port of whichever request actually triggered the login —
# Spring's own default for this property, spelled out so it's not a mystery. Works locally
# (http://localhost:8080/...) and in production alike, as long as the resulting URL is
# ALSO registered as an Authorized redirect URI in Google Cloud Console (you can register
# more than one — add the localhost one alongside the production one, don't replace it).
# Do NOT hardcode this to the production domain: this used to be
# https://www.scan2play.com.pl/login/oauth2/code/google, which made local YouTube-login
# testing impossible whenever the production host isn't reachable (e.g. Railway paused).
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
