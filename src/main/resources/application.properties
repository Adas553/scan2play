# ==============================================================================
# APPLICATION BASICS
# ==============================================================================
spring.application.name=scan2play
# Disable Docker Compose support (not needed in this project)
spring.docker.compose.enabled=false

# Messages i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# A language without a bundle of its own (English — messages.properties is the English one —, German…) gets messages.properties,
# not the bundle of the server's own language: on a Polish machine an English browser got Polish texts (SmokeTest).
spring.messages.fallback-to-system-locale=false

# Logging (set to DEBUG only for local troubleshooting)
logging.level.org.springframework.security=WARN

# ==============================================================================
# SERVER & NETWORK
# ==============================================================================
# The port the application will run on (default is 8080)
server.port=8080

# Async request timeout for Callable-based endpoints (AI eval)
spring.mvc.async.request-timeout=30000

# The executor of those Callables (a guest's request: Gemini, up to 10 s each, GeminiConfig).
# Bounded (review item 4.4): Boot's default queue is unbounded, so a slow Gemini let requests pile up long after their
# 30 s were over. 16 threads finish ~48 ten-second calls within a request's 30 s, hence a queue of 50; past it and 32 busy
# threads a request fails at once (an error page) instead of waiting for nothing.
spring.task.execution.pool.core-size=${ASYNC_POOL_CORE_SIZE:16}
spring.task.execution.pool.max-size=${ASYNC_POOL_MAX_SIZE:32}
spring.task.execution.pool.queue-capacity=${ASYNC_POOL_QUEUE_CAPACITY:50}

# Instructs Spring Boot to use X-Forwarded-* headers from the proxy (Cloudflare/Nginx)
# Essential for correct redirect URI generation when behind a reverse proxy
server.forward-headers-strategy=FRAMEWORK

# Prevents incorrect redirects to localhost by disabling context-root redirection
server.tomcat.redirect-context-root=false

# Graceful shutdown: finish in-flight requests (AI eval Callable) before stopping
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Limit form POST size (prevents abuse on guest song request forms)
server.tomcat.max-http-form-post-size=10KB

# Compress responses (gzip): the dashboard fetches HTML fragments again and again (the guest queue, up to 100 rows; the history,
# up to 300), and a phone may be on mobile data. The polls that answer 304 have no body, so they are unaffected.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json
server.compression.min-response-size=2KB

# HTTP sessions in PostgreSQL (Spring Session JDBC, review 2.3): the DJ stays logged in across a deploy. The tables are Flyway's
# (V11), never Spring's. A session lives server.servlet.session.timeout (30 min) without a request; the dashboard polls keep it.
spring.session.jdbc.initialize-schema=never

# Content-Security-Policy (SecurityConfig): false = the browsers only report what it would block (to /csp-report, logged as
# "CSP violation"); true = they block it. Switch on once the reports of real use are quiet.
security.csp.enforce=${CSP_ENFORCE:false}

# ==============================================================================
# DATABASE (PostgreSQL)
# ==============================================================================
# Railway's Postgres service exposes a complete DATABASE_URL in the format:
#   postgresql://user:password@host:port/database
# Individual PG* variables (PGHOST, PGPORT, etc.) are reference variables that
# point to ${{RAILWAY_PRIVATE_DOMAIN}} and do not resolve to concrete values
# when referenced cross-service. DATABASE_URL is the pre-built, fully-resolved
# connection string and is the only reliable source for the connection details.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:scan2play}
# No default user or password (review 5.5): without PGUSER / PGPASSWORD the application does not start, instead of trying
# a well-known password. The local defaults are in application-local.properties (the profile "local" — IntelliJ).
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

logging.level.com.zaxxer.hikari=WARN

# --- HikariCP Connection Pool ---
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000

# ==============================================================================
# JPA / HIBERNATE
# ==============================================================================
# Validate schema on startup — the schema itself is managed by Flyway (see FLYWAY below),
# never by Hibernate (no auto-update).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Show SQL queries in console (enable for local debugging only)
spring.jpa.show-sql=false
# Disable OSIV \u2014 EntityManager must NOT be tied to servlet thread lifecycle.
# Our entities have no lazy relationships, and Callable<String> runs on async threads.
spring.jpa.open-in-view=false

# ==============================================================================
# FLYWAY (database migrations)
# ==============================================================================
# Every schema change is a new src/main/resources/db/migration/V<n>__<what>.sql file.
# NEVER edit a migration that has already been applied — add the next version instead.
# Flyway runs at startup, before Hibernate validates the schema, and uses spring.datasource.*.
#
# baseline-on-migrate: a database that already has tables but no flyway_schema_history
# (every database created before Flyway was adopted, incl. production) is recorded as
# version 1 = db/migration/V1__baseline.sql instead of failing; only V2+ are applied to it.
# An empty database gets V1 applied in full.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==============================================================================
# INTEGRATIONS: GOOGLE AI (GEMINI)
# ==============================================================================
# Gemini model for AI song evaluation.
# Pinned to a stable version \u2014 do NOT use *-latest aliases (quota/model can shift).
# gemini-2.5-flash, not flash-lite: flash-lite does not recognise well-known Polish songs from a line of their lyrics. Its price
# ($0.30 / $2.50 per 1M tokens in / out, thinking billed as output) is still a fraction of a cent per request.
# GOOGLE_AI_MODEL overrides it (e.g. to try a newer model without a code change).
google.ai.model-name=${GOOGLE_AI_MODEL:gemini-2.5-flash}
# Tokens the model may think before answering a guest (0 = off, -1 = the model decides): a little helps it work out the song a line
# of lyrics comes from; each one is paid and adds to the guest's wait (the call times out after 10 s).
google.ai.thinking-budget=${GOOGLE_AI_THINKING_BUDGET:1024}
google.ai.api-key=${GOOGLE_AI_API_KEY}

# ==============================================================================
# SCAN2PLAY BUSINESS LOGIC
# ==============================================================================
# Public base URL that guests open — it is encoded in the dashboard QR code and shown as "Your Party Link".
# Defaults to production. For local testing set the SCAN2PLAY_GUEST_URL environment variable (e.g. in the
# IntelliJ run configuration) to an address your phone can reach, i.e. this machine's LAN IP, NOT localhost:
#   SCAN2PLAY_GUEST_URL=http://192.168.1.23:8080/
# (the DJ dashboard itself still has to be opened via localhost — Google login redirects to localhost).
scan2play.guest-url=https://www.scan2play.com.pl/

# ==============================================================================
# GUEST REQUEST LIMITS ON THE SERVER (GuestRequestLimiter)
# ==============================================================================
# The DJ's per-guest limit lives in the session, which a request without the cookie does not have. These do not need it and
# count a request before the AI evaluates it. 0 = off.
# Client IP + party: loose, because the guests on a venue's Wi-Fi share one public address. The window is also how long a guest's
# IP address stays in memory — the privacy pages (privacy*.html) say "10 minutes": change them with it (SmokeTest checks).
guest.limit.per-ip-party=${GUEST_LIMIT_PER_IP_PARTY:30}
guest.limit.per-ip-window-minutes=${GUEST_LIMIT_PER_IP_WINDOW_MINUTES:10}
# Party, whatever the address, per 24 hours: the most one party (or a script faking addresses) can spend.
guest.limit.per-party-daily=${GUEST_LIMIT_PER_PARTY_DAILY:300}
# The header that holds the client address, set by a proxy that overwrites it (behind Cloudflare: CF-Connecting-IP).
# Empty = the remote address, which with the FRAMEWORK strategy above is the first X-Forwarded-For entry (a client can fake it).
guest.client-ip-header=${GUEST_CLIENT_IP_HEADER:}

# ==============================================================================
# NOTIFICATIONS ON THE DJ'S DEVICES (Web Push, PushNotificationService)
# ==============================================================================
# The server's VAPID key pair (P-256), made once with VapidKeyGenerator (src/test/java) and kept as secrets — never in the repo.
# Public: the uncompressed point, base64url (the browser's applicationServerKey). Private: PKCS#8, base64 (one line). Both empty =
# no notifications: the dashboard does not offer the switch, nothing is sent.
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
# Who the push services may contact about this sender (the VAPID "sub" claim).
push.vapid.subject=${VAPID_SUBJECT:https://www.scan2play.com.pl/}

# ==============================================================================
# SECURITY: OAUTH2 CLIENT REGISTRATION (GOOGLE)
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Recommended scopes:
# - openid: enables OpenID Connect
# - profile: access to basic profile info
# - email: access to user's email address
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where Google redirects after successful login.
# {baseUrl} = the scheme+host+port of whichever request actually triggered the login —
# Spring's own default for this property, spelled out so it's not a mystery. Works locally
# (http://localhost:8080/...) and in production alike, as long as the resulting URL is
# ALSO registered as an Authorized redirect URI in Google Cloud Console (you can register
# more than one — add the localhost one alongside the production one, don't replace it).
# Do NOT hardcode this to the production domain (https://www.scan2play.com.pl/login/oauth2/code/google):
# local Google login would then depend on the production host being reachable, and it
# is not whenever Railway is paused.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
