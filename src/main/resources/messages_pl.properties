# --- Jak to dzia\u0142a? (Poradnik na stronie startowej) ---
landing.guide.title=Jak to dzia\u0142a?
landing.guide.step1.title=Za\u0142\u00F3\u017C imprez\u0119
landing.guide.step1.text=Zaloguj si\u0119 <strong>kontem Google</strong> i impreza gotowa. Grasz ze swojego programu (VirtualDJ, Serato, rekordbox\u2026) \u2014 Scan2Play nie ma odtwarzacza: zbiera i filtruje pro\u015Bby go\u015Bci, a Ty je grasz.
landing.guide.step2.title=Ustaw klimat i limity
landing.guide.step2.text=Wybierz <strong>klimat imprezy</strong> (np. Polskie przeboje, Retro lat 80. & 90.) \u2014 AI odrzuci piosenki, kt\u00F3re psuj\u0105 klimat. Ustaw <strong>limit pr\u00F3\u015Bb</strong> na go\u015Bcia i <strong>pami\u0119\u0107 powt\u00F3rek</strong> \u2014 AI nie przyjmie piosenki, kt\u00F3ra niedawno lecia\u0142a, a kolejne pro\u015Bby o piosenk\u0119 czekaj\u0105c\u0105 w kolejce zamieniaj\u0105 si\u0119 w <strong>g\u0142osy</strong>.
landing.guide.step3.title=Udost\u0119pnij kod QR
landing.guide.step3.text=Panel generuje unikalny <strong>kod QR</strong>. Wy\u015Bwietl go na ekranie, laptopie lub wydrukuj. Go\u015Bcie skanuj\u0105 telefonem \u2014 bez instalowania aplikacji!
landing.guide.step4.title=Zarz\u0105dzaj kolejk\u0105
landing.guide.step4.text=Wszystkie zatwierdzone pro\u015Bby trafiaj\u0105 na Tw\u00F3j panel \u2014 tak\u017Ce na telefonie. Odhaczasz je \u201E\u25B6 Zagrane\u201D albo \u201E\u23ED Pomi\u0144\u201D, <strong>\uD83D\uDD0D Podejrzyj</strong> pokazuje piosenk\u0119, kt\u00F3rej nie znasz, a kolumna <strong>G\u0142osy</strong> m\u00F3wi, czego sala chce najbardziej. <strong>Historia</strong> pami\u0119ta, co zagra\u0142o, a co zosta\u0142o odrzucone.
landing.guide.step5.title=Ciesz si\u0119 imprez\u0105!
landing.guide.step5.text=Skup si\u0119 na miksowaniu i kontakcie z lud\u017Ami. Scan2Play zajmuje si\u0119 selekcj\u0105 muzyczn\u0105. Koniec z pytaniami: \u201EA zagrasz to?\u201D

