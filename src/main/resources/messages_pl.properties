# The landing page (2026-10-17): the app on a laptop and a phone, three steps, what one gets, for whom, the questions
landing.hero.title=Go\u015Bcie prosz\u0105 o piosenki. AI pilnuje klimatu. Ty grasz.
landing.hero.subtitle=Go\u015Bcie skanuj\u0105 kod QR i wpisuj\u0105 piosenk\u0119 w telefonie \u2014 bez instalowania aplikacji. AI odrzuca to, co nie pasuje do imprezy, a Ty widzisz gotow\u0105 kolejk\u0119 z g\u0142osami i grasz ze swojego programu.
landing.hero.free=Za darmo. Bez karty i bez instalowania.
landing.hero.alt.dashboard=Panel DJ-a na laptopie: kolejka pr\u00F3\u015Bb z g\u0142osami, s\u0142owami i dedykacjami go\u015Bci oraz komentarzami AI (przyk\u0142adowa impreza)
landing.hero.alt.guest=Strona go\u015Bcia na telefonie: pole na piosenk\u0119 z dedykacj\u0105 i pro\u015Bby innych go\u015Bci z g\u0142osami (przyk\u0142adowa impreza)
landing.steps.title=Jak to dzia\u0142a
landing.step1.title=Za\u0142\u00F3\u017C imprez\u0119
landing.step1.text=Zaloguj si\u0119 kontem Google, wybierz klimat i wydrukuj kod QR \u2014 plakat albo karty na sto\u0142y.
landing.step2.title=Go\u015Bcie skanuj\u0105 i prosz\u0105
landing.step2.text=Telefonem, bez aplikacji. Wpisuj\u0105 wykonawc\u0119 i tytu\u0142, a na piosenki innych daj\u0105 \uD83D\uDC4D. Od razu wiedz\u0105, czy pro\u015Bba przesz\u0142a.
landing.step3.title=Grasz z kolejki
landing.step3.text=AI przepuszcza tylko to, co pasuje. Kolejk\u0119 masz na laptopie albo telefonie: \u201EKopiuj\u201D wkleja piosenk\u0119 do wyszukiwarki Twojego programu, \u201EZagrane\u201D j\u0105 odhacza.
landing.features.title=Co dostajesz
landing.feature.vibe.title=AI pilnuje klimatu
landing.feature.vibe.text=Ka\u017Cd\u0105 pro\u015Bb\u0119 AI sprawdza pod klimat i Tw\u00F3j opis imprezy, odrzuca to, co ju\u017C dzi\u015B lecia\u0142o, a go\u015Bciowi odpowiada kr\u00F3tkim komentarzem, jak DJ.
landing.feature.words.title=Widzisz, o co prosi\u0142 go\u015B\u0107
landing.feature.words.text=Pod piosenk\u0105 s\u0105 jego s\u0142owa. Gdy AI mog\u0142o \u017Ale zrozumie\u0107, piosenka ma znak \u201E\u26A0 Sprawd\u017A\u201D.
landing.feature.votes.title=G\u0142osy sali
landing.feature.votes.text=Ta sama piosenka to jeden wiersz z liczb\u0105 g\u0142os\u00F3w. Od razu wida\u0107, czego chce parkiet.
landing.feature.dedications.title=Dedykacje
landing.feature.dedications.text=Go\u015B\u0107 mo\u017Ce dopisa\u0107 do piosenki dedykacj\u0119 \u2014 \u201Edla Ani na 18-stk\u0119\u201D. Widzisz j\u0105 tylko Ty, a obra\u017Aliwe AI odrzuca.
landing.feature.hosts.title=Lista gospodarzy
landing.feature.hosts.text=Gospodarze imprezy wpisuj\u0105 przez link, co koniecznie zagra\u0107, a czego nie. Zakazane piosenki odpadaj\u0105 same.
landing.feature.phone.title=Telefon i obs\u0142uga
landing.feature.phone.text=Powiadomienie o nowej pro\u015Bbie na telefonie. Drugi DJ albo barman pomaga ze swojego konta.
landing.who.title=Dla kogo
landing.who.wedding.title=DJ weselny
landing.who.wedding.text=Go\u015Bcie nie podchodz\u0105 co chwil\u0119 do konsoli, a lista pary m\u0142odej jest pod r\u0119k\u0105.
landing.who.club.title=Kluby i imprezy
landing.who.club.text=Sala g\u0142osuje, a AI trzyma si\u0119 Twojego gatunku.
landing.who.pub.title=Puby i bary
landing.who.pub.text=Kod QR na stolikach, kolejka na telefonie barmana, limity przeciw spamowi.
landing.who.karaoke.title=Karaoke
landing.who.karaoke.text=Go\u015Bcie zapisuj\u0105 piosenki do \u015Bpiewania, a Ty widzisz kolejk\u0119 z numerami.
forWhom.breadcrumb=Gdzie jeste\u015B
forWhom.faq.title=Pytania
forWhom.others.title=Dla kogo jeszcze
forWhom.home=Strona g\u0142\u00F3wna Scan2Play
forWhom.back=\u2190 Wr\u00F3\u0107 na stron\u0119 g\u0142\u00F3wn\u0105
forWhom.wedding.seo.title=Pro\u015Bby o piosenki na wesele przez kod QR \u2013 Scan2Play dla DJ-a
forWhom.wedding.seo.description=Go\u015Bcie weselni prosz\u0105 o piosenki z telefonu, AI pilnuje klimatu, a lista pary m\u0142odej jest pod r\u0119k\u0105. Bez podchodzenia do konsoli. Za darmo, bez instalowania.
forWhom.wedding.icon=\uD83D\uDC8D
forWhom.wedding.steps.title=Jak to wygl\u0105da na weselu
forWhom.wedding.features.title=Co si\u0119 przydaje na weselu
forWhom.wedding.title=Wesele bez kolejki przy konsoli
forWhom.wedding.lede=Go\u015Bcie skanuj\u0105 kod QR ze stolika i wpisuj\u0105 piosenk\u0119 w telefonie. Ty widzisz pro\u015Bby w jednej kolejce, z g\u0142osami, i grasz ze swojego programu \u2014 bez karteczek i bez krzyczenia przez muzyk\u0119.
forWhom.wedding.step1.title=Przed weselem
forWhom.wedding.step1.text=Zak\u0142adasz imprez\u0119, wybierasz klimat (np. \u201EKlasyki weselne\u201D albo \u201EPolskie przeboje\u201D) i drukujesz plakat z kodem QR oraz karty na sto\u0142y.
forWhom.wedding.step2.title=Para m\u0142oda dopisuje swoje listy
forWhom.wedding.step2.text=Przez link, bez logowania: piosenki, kt\u00F3re maj\u0105 zagra\u0107, i te, kt\u00F3rych nie chc\u0105.
forWhom.wedding.step3.title=W trakcie
forWhom.wedding.step3.text=Go\u015Bcie wysy\u0142aj\u0105 pro\u015Bby, AI odrzuca to, co nie pasuje do klimatu, a ta sama piosenka od kilku os\u00F3b zbiera g\u0142osy.
forWhom.wedding.step4.title=Po weselu
forWhom.wedding.step4.text=Go\u015Bcie widz\u0105 Twoje profile i mog\u0105 Ci\u0119 zarezerwowa\u0107 na swoj\u0105 imprez\u0119.
forWhom.wedding.feature1.icon=\uD83D\uDC8C
forWhom.wedding.feature1.title=Dedykacje
forWhom.wedding.feature1.text=\u201EDla Ani na 18-stk\u0119\u201D: widzisz je tylko Ty, a obra\u017Aliwe AI zatrzymuje. Mo\u017Cesz je wy\u0142\u0105czy\u0107.
forWhom.wedding.feature2.icon=\uD83D\uDCFA
forWhom.wedding.feature2.title=Ekran na TV
forWhom.wedding.feature2.text=Dziesi\u0119\u0107 najbardziej chcianych piosenek i kod QR na telewizorze w sali.
forWhom.wedding.feature3.icon=\uD83D\uDD14
forWhom.wedding.feature3.title=Powiadomienia na telefonie
forWhom.wedding.feature3.text=Nowa pro\u015Bba dociera, nawet gdy panel jest schowany.
forWhom.wedding.feature4.icon=\uD83D\uDCC4
forWhom.wedding.feature4.title=Podsumowanie wieczoru
forWhom.wedding.feature4.text=Co gra\u0142o i o co proszono \u2014 do pobrania po imprezie.
forWhom.wedding.faq1.q=Czy starsi go\u015Bcie sobie poradz\u0105?
forWhom.wedding.faq1.a=Wystarczy aparat telefonu: skanuj\u0105 kod i od razu widz\u0105 pole na piosenk\u0119. Bez aplikacji, bez konta.
forWhom.wedding.faq2.q=Co, je\u015Bli kto\u015B poprosi o disco polo na weselu rockowym?
forWhom.wedding.faq2.a=AI odrzuci pro\u015Bb\u0119, kt\u00F3ra nie pasuje do wybranego klimatu, i powie go\u015Bciowi dlaczego. Ty i tak widzisz ka\u017Cd\u0105 pro\u015Bb\u0119 przed zagraniem.
forWhom.wedding.faq3.q=Czy go\u015Bcie mog\u0105 zasypa\u0107 mnie pro\u015Bbami?
forWhom.wedding.faq3.a=Ka\u017Cdy go\u015B\u0107 ma limit pr\u00F3\u015Bb i przerw\u0119 mi\u0119dzy nimi, a ta sama piosenka nie trafia do kolejki drugi raz, tylko zbiera g\u0142osy.
forWhom.club.seo.title=Pro\u015Bby o piosenki w klubie przez kod QR \u2013 Scan2Play dla DJ-a
forWhom.club.seo.description=Go\u015Bcie klubu prosz\u0105 o utwory z telefonu i g\u0142osuj\u0105 na pro\u015Bby innych, a AI odrzuca to, co nie pasuje do Twojego gatunku. Za darmo, bez instalowania.
forWhom.club.icon=\uD83C\uDFA7
forWhom.club.steps.title=Jak to wygl\u0105da w klubie
forWhom.club.features.title=Co si\u0119 przydaje w klubie
forWhom.club.title=Sala m\u00F3wi, czego chce. Gatunek zostaje Tw\u00F3j.
forWhom.club.lede=Go\u015Bcie skanuj\u0105 kod QR i prosz\u0105 o utwory z telefonu, a reszta sali g\u0142osuje. AI trzyma si\u0119 gatunku, kt\u00F3ry ustawisz, wi\u0119c do kolejki nie trafia nic spoza Twojego seta.
forWhom.club.step1.title=Przed otwarciem
forWhom.club.step1.text=Ustawiasz klimat (np. \u201EKlubowa & EDM\u201D, \u201EHip-Hop & Rap\u201D, \u201ELatino\u201D) i wieszasz kod QR przy barze i na ekranach.
forWhom.club.step2.title=W nocy
forWhom.club.step2.text=Pro\u015Bby spoza gatunku AI odrzuca od razu, z kr\u00F3tkim wyja\u015Bnieniem dla go\u015Bcia.
forWhom.club.step3.title=G\u0142osy
forWhom.club.step3.text=Go\u015Bcie daj\u0105 \uD83D\uDC4D pro\u015Bbom innych, wi\u0119c widzisz, czego chce sala, a nie tylko najg\u0142o\u015Bniejszy przy konsoli.
forWhom.club.step4.title=Grasz po swojemu
forWhom.club.step4.text=Kolejno\u015B\u0107 ustalasz Ty; oznaczasz \u201EZagrane\u201D albo \u201EPomi\u0144\u201D.
forWhom.club.feature1.icon=\uD83D\uDCFA
forWhom.club.feature1.title=Ekran na TV
forWhom.club.feature1.text=Najbardziej chciane utwory i kod QR na ekranach w klubie.
forWhom.club.feature2.icon=\uD83D\uDCF1
forWhom.club.feature2.title=Panel na telefonie
forWhom.club.feature2.text=Kolejka mie\u015Bci si\u0119 na telefonie przy konsoli, z powiadomieniami o nowych pro\u015Bbach.
forWhom.club.feature3.icon=\u23F1\uFE0F
forWhom.club.feature3.title=Limity pr\u00F3\u015Bb
forWhom.club.feature3.text=Ustawiasz, ile pr\u00F3\u015Bb mo\u017Ce wys\u0142a\u0107 jeden go\u015B\u0107 i jak d\u0142ugo czeka.
forWhom.club.feature4.icon=\uD83D\uDCAC
forWhom.club.feature4.title=Styl komentarzy AI
forWhom.club.feature4.text=Go\u015B\u0107 dostaje odpowied\u017A w tonie, kt\u00F3ry pasuje do klubu.
forWhom.club.faq1.q=Czy Scan2Play odtwarza muzyk\u0119?
forWhom.club.faq1.a=Nie. Grasz ze swojego programu (rekordbox, Serato, VirtualDJ, djay\u2026). Scan2Play zbiera i filtruje pro\u015Bby.
forWhom.club.faq2.q=Czy na jednym Wi-Fi klubu limity nie zablokuj\u0105 wszystkich?
forWhom.club.faq2.a=Limit sieci jest lu\u017Any, bo ca\u0142y klub to jeden adres; g\u0142\u00F3wny limit liczy si\u0119 dla ka\u017Cdego go\u015Bcia osobno.
forWhom.club.faq3.q=Co, je\u015Bli AI nie dzia\u0142a?
forWhom.club.faq3.a=Pro\u015Bby trafiaj\u0105 do Ciebie niesprawdzone, z dopiskiem \u2014 \u017Cadna nie ginie.
forWhom.pub.seo.title=Zamawianie piosenek w pubie przez kod QR \u2013 Scan2Play
forWhom.pub.seo.description=Kod QR na stolikach, pro\u015Bby o piosenki w telefonie barmana, limity przeciw spamowi. Go\u015Bcie nie podchodz\u0105 do baru po muzyk\u0119. Za darmo, bez instalowania.
forWhom.pub.icon=\uD83C\uDF7A
forWhom.pub.steps.title=Jak to wygl\u0105da w pubie
forWhom.pub.features.title=Co si\u0119 przydaje w pubie
forWhom.pub.title=Muzyka na \u017Cyczenie go\u015Bci, bez stania przy barze
forWhom.pub.lede=Kod QR na stolikach, pro\u015Bby go\u015Bci w telefonie barmana. AI odrzuca to, co nie pasuje do klimatu lokalu, a limity nie pozwalaj\u0105 jednemu stolikowi przej\u0105\u0107 wieczoru.
forWhom.pub.step1.title=Na start
forWhom.pub.step1.text=Zak\u0142adasz imprez\u0119, wybierasz klimat (np. \u201ERock & Metal\u201D, \u201ERetro lat 80. & 90\u201D, \u201EChillout & Lounge\u201D) i drukujesz karty na stoliki lub wieszasz kartk\u0119 przy barze.
forWhom.pub.step2.title=Zapraszasz obs\u0142ug\u0119
forWhom.pub.step2.text=Barman dostaje link z zaproszeniem i loguje si\u0119 kontem Google; widzi kolejk\u0119 i mo\u017Ce oznacza\u0107 \u201EZagrane\u201D \u2014 tylko to, na co mu pozwolisz.
forWhom.pub.step3.title=Wieczorem
forWhom.pub.step3.text=Go\u015Bcie prosz\u0105 z telefonu, a ta sama piosenka od kilku stolik\u00F3w zbiera g\u0142osy.
forWhom.pub.step4.title=Kolejny wiecz\u00F3r
forWhom.pub.step4.text=Wznawiasz imprez\u0119: ten sam kod QR na stolikach dzia\u0142a dalej.
forWhom.pub.feature1.icon=\uD83D\uDEE1\uFE0F
forWhom.pub.feature1.title=Limity przeciw spamowi
forWhom.pub.feature1.text=Pro\u015Bby na go\u015Bcia, przerwa mi\u0119dzy nimi, bez powt\u00F3rek ostatnio granych.
forWhom.pub.feature2.icon=\uD83D\uDCFA
forWhom.pub.feature2.title=Ekran na TV
forWhom.pub.feature2.text=Najbardziej chciane piosenki i kod QR na telewizorze w lokalu.
forWhom.pub.feature3.icon=\uD83D\uDCB8
forWhom.pub.feature3.title=Napiwki
forWhom.pub.feature3.text=Go\u015B\u0107 mo\u017Ce zostawi\u0107 napiwek przez Tw\u00F3j link.
forWhom.pub.feature4.icon=\uD83D\uDD58
forWhom.pub.feature4.title=Historia
forWhom.pub.feature4.text=Co gra\u0142o w poprzednie wieczory.
forWhom.pub.faq1.q=Czy go\u015Bcie musz\u0105 si\u0119 logowa\u0107?
forWhom.pub.faq1.a=Nie. Skanuj\u0105 kod i pisz\u0105. Loguj\u0105 si\u0119 tylko w\u0142a\u015Bciciel i obs\u0142uga.
forWhom.pub.faq2.q=Ile to kosztuje?
forWhom.pub.faq2.a=Nic. Scan2Play jest za darmo \u2014 bez karty i bez instalowania.
forWhom.pub.faq2.a.plans=Za darmo masz wszystko, czego potrzeba na imprez\u0119. Pro dodaje m.in. list\u0119 gospodarzy, profile i napiwki oraz podsumowanie wieczoru.
landing.faq.title=Pytania
landing.faq.install.q=Czy go\u015Bcie musz\u0105 co\u015B instalowa\u0107?
landing.faq.install.a=Nie. Skanuj\u0105 kod QR aparatem telefonu i od razu widz\u0105 stron\u0119 imprezy.
landing.faq.player.q=Czy Scan2Play odtwarza muzyk\u0119?
landing.faq.player.a=Nie. Grasz ze swojego programu (VirtualDJ, Serato, rekordbox, djay\u2026). Scan2Play zbiera i filtruje pro\u015Bby go\u015Bci.
landing.faq.price.q=Ile to kosztuje?
landing.faq.price.a=Za darmo masz wszystko, czego potrzeba na imprez\u0119. Pro dodaje m.in. list\u0119 gospodarzy, profile i napiwki oraz podsumowanie wieczoru.
landing.faq.price.free=Nic. Scan2Play jest za darmo \u2014 bez karty i bez instalowania.
landing.faq.price.link=Zobacz, co daje Pro \u2192
landing.faq.ai.q=Co, je\u015Bli AI si\u0119 pomyli albo nie dzia\u0142a?
landing.faq.ai.a=Ka\u017Cd\u0105 pro\u015Bb\u0119 widzisz przed zagraniem, ze s\u0142owami go\u015Bcia, i mo\u017Cesz j\u0105 pomin\u0105\u0107. Gdy AI nie odpowiada, pro\u015Bby trafiaj\u0105 do Ciebie niesprawdzone \u2014 impreza ich nie traci.
landing.faq.phone.q=Czy dzia\u0142a na telefonie DJ-a?
landing.faq.phone.a=Tak. Panel dzia\u0142a na telefonie i laptopie. Mo\u017Cesz doda\u0107 go do ekranu g\u0142\u00F3wnego i dostawa\u0107 powiadomienia o nowych pro\u015Bbach.
landing.faq.data.q=Jakie dane zbieracie o go\u015Bciach?
landing.faq.data.a=Go\u015Bcie nie zak\u0142adaj\u0105 kont i nie podaj\u0105 e-maila. Ich pro\u015Bby widzi DJ, a po 30 dniach s\u0105 usuwane.
landing.faq.data.link=Polityka prywatno\u015Bci \u2192
landing.final.title=Czas na nast\u0119pn\u0105 imprez\u0119?
landing.final.text=Imprez\u0119 za\u0142o\u017Cysz w minut\u0119, a kod QR dostaniesz od razu.
landing.error.login=B\u0142\u0105d logowania. Spr\u00F3buj ponownie.
landing.staff.summary=Masz link z zaproszeniem od DJ-a? Wklej go tutaj
landing.staff.label=Wklej link zaproszenia od organizatora imprezy
landing.staff.invalid=Ten link nie dzia\u0142a \u2014 popro\u015B organizatora o nowy.
landing.staff.guests=To link dla go\u015Bci (\u2026/p/\u2026), nie zaproszenie. Zaproszenie do obs\u0142ugi zawiera \u201E/join/\u201D \u2014 popro\u015B o nie organizatora.

