# --- Jak to dzia\u0142a? (Poradnik na stronie startowej) ---
landing.guide.title=Jak to dzia\u0142a?
landing.guide.step1.title=Wybierz silnik muzyczny
landing.guide.step1.text=Zdecyduj, w jakim systemie dzi\u015B pracujesz. <strong>Spotify</strong> \u2014 piosenki trafiaj\u0105 prosto do Twojej kolejki. <strong>YouTube</strong> \u2014 wbudowany odtwarzacz wideo na panelu Scan2Play. Wyb\u00F3r jest sta\u0142y dla danej sesji.
landing.guide.step2.title=Ustaw klimat i limity
landing.guide.step2.text=Wybierz <strong>Global Vibe</strong> (np. Retro 80s, Club & EDM) \u2014 AI odrzuci piosenki, kt\u00F3re psuj\u0105 klimat. Ustaw <strong>limit pr\u00F3\u015Bb</strong> na go\u015Bcia i <strong>pami\u0119\u0107 duplikat\u00F3w</strong>, by unikn\u0105\u0107 powt\u00F3rek.
landing.guide.step3.title=Udost\u0119pnij kod QR
landing.guide.step3.text=Panel generuje unikalny <strong>kod QR</strong>. Wy\u015Bwietl go na ekranie, laptopie lub wydrukuj. Go\u015Bcie skanuj\u0105 telefonem \u2014 bez instalowania aplikacji!
landing.guide.step4.title=Zarz\u0105dzaj kolejk\u0105
landing.guide.step4.text=Wszystkie zatwierdzone pr\u00F3\u015Bby trafiaj\u0105 na Tw\u00F3j pulpit. W\u0142\u0105cz <strong>Auto-Pilot</strong>, by system sam odtwarza\u0142 piosenki, lub zostaw tryb <strong>Manual</strong> dla pe\u0142nej kontroli. Mo\u017Cesz te\u017C ustawi\u0107 <strong>Playlist\u0119 zapasow\u0105</strong> \u2014 wklej adres playlisty z YouTube, a b\u0119dzie gra\u0107 w tle, gdy kolejka go\u015Bci jest pusta. W\u0142\u0105cz <strong>Losow\u0105 kolejno\u015B\u0107</strong>, by unikn\u0105\u0107 powtarzania tego samego porz\u0105dku.
landing.guide.step5.title=Ciesz si\u0119 imprez\u0105!
landing.guide.step5.text=Skup si\u0119 na miksowaniu i kontakcie z lud\u017Ami. Scan2Play zajmuje si\u0119 selekcj\u0105 muzyczn\u0105. Koniec z pytaniami: \u201EA zagrasz to?\u201D

