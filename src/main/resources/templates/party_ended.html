<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{party.ended.title}">Party Ended - Scan2Play</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card { background-color: #161616; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-5">
        <h1 class="display-4 mb-3">👋</h1>
        <h2 class="mb-4" th:text="#{party.ended.title}">This party has ended</h2>
        <p class="lead text-secondary" th:text="#{party.ended.subtitle}">Thanks for partying with Scan2Play!</p>
        <p class="text-secondary mt-3" th:text="#{party.ended.see_you}">See you at the next event.</p>
        <div class="mt-4">
            <a href="/" class="btn btn-outline-light" th:text="#{party.ended.home_btn}">Go Home</a>
        </div>
    </div>
</div>
</body>
</html>
