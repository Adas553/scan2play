<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{party.ended.title}">Party Ended - Scan2Play</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="page-status page-ended">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card p-5">
                <h1 class="display-1 mb-3">👋</h1>
                <h2 class="mb-4 fw-bold text-light-custom" th:text="#{party.ended.title}">This party has ended</h2>
                <p class="lead text-secondary-bright" th:text="#{party.ended.subtitle}">Thanks for partying with Scan2Play!</p>
                <p class="text-secondary-bright mt-3" th:text="#{party.ended.see_you}">See you at the next event.</p>
                <div class="mt-4">
                    <a href="/" class="btn btn-outline-light btn-lg px-5" th:text="#{party.ended.home_btn}">Go Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/components :: footer}"></div>

</body>
</html>
