<!DOCTYPE html>
<!--/* A new password's link (V72, PasswordAccountService), Polish. Mail programs read little CSS — inline styles only, one column, no images. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head><meta charset="UTF-8"><title>Scan2Play</title></head>
<body style="margin:0;padding:24px;background:#ffffff;color:#1a1a1a;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;">
<div style="max-width:560px;">
<p>Cześć!</p>
<p>Ktoś poprosił o nowe hasło do Twojego konta w Scan2Play. Ustawisz je tutaj:</p>
<p><a th:href="${link}" href="https://www.scan2play.com.pl/" style="display:inline-block;padding:12px 20px;background:#0a7f99;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;">Ustaw nowe hasło</a></p>
<p style="color:#666666;font-size:13px;">Albo skopiuj ten adres do przeglądarki: <span th:text="${link}">https://www.scan2play.com.pl/</span></p>
<p>Link działa godzinę i tylko raz. Jeśli to nie Ty — zignoruj tego maila, Twoje hasło się nie zmieni.</p>
<p>Scan2Play</p>
</div>
</body>
</html>
