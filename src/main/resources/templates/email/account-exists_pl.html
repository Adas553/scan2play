<!DOCTYPE html>
<!--/* To an address that has a confirmed account and was registered again (V72), Polish: no new account, the new password's link. Mail programs read little CSS — inline styles only, one column, no images. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head><meta charset="UTF-8"><title>Scan2Play</title></head>
<body style="margin:0;padding:24px;background:#ffffff;color:#1a1a1a;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;">
<div style="max-width:560px;">
<p>Cześć!</p>
<p>Ktoś chciał założyć konto w Scan2Play na ten adres, ale masz już u nas konto. Zaloguj się na <a href="https://www.scan2play.com.pl/login" th:href="${siteUrl} + '/login'" style="color:#0a7f99;">www.scan2play.com.pl/login</a>, a jeśli nie pamiętasz hasła, ustaw nowe:</p>
<p><a th:href="${link}" href="https://www.scan2play.com.pl/" style="display:inline-block;padding:12px 20px;background:#0a7f99;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;">Ustaw nowe hasło</a></p>
<p>Link działa godzinę. Jeśli to nie Ty — zignoruj tego maila, nic się nie zmieni.</p>
<p>Scan2Play</p>
</div>
</body>
</html>
