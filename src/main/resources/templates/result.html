<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{result.title}">DJ's Verdict</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="page-guest">
<div class="container d-flex flex-column align-items-center text-center">
    <div th:replace="~{fragments/components :: back-to-dashboard}"></div>
    <div class="card p-5 shadow-lg text-white">

        <h2 class="mb-4 text-white" th:text="${response.songName}">Song Name</h2>
        <!--/* unchecked: the AI could not be asked, and the request went on to the DJ unchecked */-->
        <div th:class="${response.decision == 'accepted' ? 'accepted' : 'rejected'}">
            <h1 class="display-1 fw-bold"
                th:text="${response.unchecked} ? #{result.decision.to_dj} : (${response.decision == 'accepted'} ? #{result.decision.accepted} : #{result.decision.rejected})">
                STATUS
            </h1>
        </div>

        <!--/* The same song already waited: this request was one more vote on it — or it was the guest's own (SongRequestCommandService) */-->
        <div th:if="${response.vote}" id="voteAdded" class="alert alert-warning fw-bold py-2 mt-4 mb-0" role="status"
             th:text="#{result.vote.added(${response.votes})}">Someone already asked for it — your vote is in!</div>
        <div th:if="${response.ownSong}" id="voteOwn" class="alert alert-info fw-bold py-2 mt-4 mb-0" role="status"
             th:text="#{result.vote.own(${response.votes})}">Your request for this song is already waiting.</div>

        <p class="mt-4 lead fst-italic text-light" th:text="${response.comment}">DJ's Comment</p>

        <div class="mt-4" th:unless="${response.unchecked}">
            <span class="badge bg-secondary p-2" th:text="#{result.energy(${response.energyLevel})}">Energy: 0/10</span>
        </div>

        <a th:href="@{/p/{code}(code=${partyCode})}" class="btn btn-outline-light mt-5" th:text="#{result.button.suggest_another}">Suggest another one</a>
    </div>
</div>
<div th:replace="~{fragments/components :: footer}"></div>

</body>
</html>
