<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{result.title}">DJ's Verdict</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="page-guest">
<div class="container d-flex flex-column align-items-center text-center">
    <div class="card p-5 shadow-lg text-white">

        <h2 class="mb-4 text-white" th:text="${response.songName}">Song Name</h2>
        <div th:class="${response.decision == 'accepted' ? 'accepted' : 'rejected'}">
            <h1 class="display-1 fw-bold"
                th:text="${response.decision == 'accepted'} ? #{result.decision.accepted} : #{result.decision.rejected}">
                STATUS
            </h1>
        </div>

        <p class="mt-4 lead fst-italic text-light" th:text="${response.comment}">DJ's Comment</p>

        <div class="mt-4">
            <span class="badge bg-secondary p-2">Energy: <span th:text="${response.energyLevel}">0</span>/10</span>
        </div>

        <!--/* Where the guest's song waits (GuestQueueService): the first of the guest's songs still in the queue */-->
        <div th:if="${guestQueue != null and guestQueue.myPosition() != null}" id="myPosition"
             class="alert alert-success fw-bold py-2 mt-4 mb-0" role="status"
             th:text="#{home.queue.my_position(${guestQueue.mySong()}, ${guestQueue.myPosition()})}">Your song is number 3 in the queue</div>

        <a th:href="@{/p/{code}(code=${partyCode})}" class="btn btn-outline-light mt-5" th:text="#{result.button.suggest_another}">Suggest another one</a>
    </div>
</div>
<div th:replace="~{fragments/components :: footer}"></div>

</body>
</html>
