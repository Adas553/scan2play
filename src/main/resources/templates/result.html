<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Werdykt DJ-a</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; display: flex; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; border-radius: 20px; border: 2px solid #333; }
        .accepted { color: #1DB954; } /* Spotify Green */
        .rejected { color: #ff4444; }
    </style>
</head>
<body>
<div class="container text-center">
    <div class="card p-5 shadow-lg">
        <h2 class="mb-4" th:text="${response.songName}">Song Name</h2>

        <div th:class="${response.decision == 'accepted' ? 'accepted' : 'rejected'}">
            <h1 class="display-1 fw-bold" th:text="${response.decision == 'accepted' ? 'TAK!' : 'NIE'}">STATUS</h1>
        </div>

        <p class="mt-4 lead italic" th:text="${response.comment}">Komentarz DJ-a</p>

        <div class="mt-4">
            <span class="badge bg-secondary p-2">Energia: <span th:text="${response.energyLevel}">0</span>/10</span>
        </div>

        <a href="/" class="btn btn-outline-light mt-5">Zaproponuj kolejną</a>
    </div>
</div>
</body>
</html>
