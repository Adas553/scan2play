<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{result.title}">DJ's Verdict</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- a dark page already: a browser's own dark mode (Samsung Internet) must not darken it again — it greyed our logo -->
    <meta name="color-scheme" content="dark">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="page-guest">
<div class="container d-flex flex-column align-items-center text-center">
    <div th:replace="~{fragments/components :: back-to-dashboard}"></div>
    <div class="card p-4 p-sm-5 shadow-lg text-white">

        <!--/* the same party as the page the guest came from: our logo and who plays, small (the design review, 2026-10-09) */-->
        <p class="fw-bold mb-3"><th:block th:replace="~{fragments/components :: logo}"></th:block><th:block th:if="${djName != null}"><span
                class="text-secondary fw-normal"> · </span><span id="djName" th:text="#{party.dj(${djName})}">🎧 Gra: DJ Koko</span></th:block></p>

        <h2 class="mb-3 text-white" th:text="${response.songName}">Song Name</h2>
        <!--/* unchecked: the AI could not be asked, and the request went on to the DJ unchecked */-->
        <div th:class="${response.decision == 'accepted' ? 'accepted' : 'rejected'}">
            <h1 class="s2p-verdict mb-0"
                th:text="${response.unchecked} ? #{result.decision.to_dj} : (${response.decision == 'accepted'} ? #{result.decision.accepted} : #{result.decision.rejected})">
                STATUS
            </h1>
        </div>

        <!--/* The same song already waited: this request was one more vote on it — or it was the guest's own (SongRequestCommandService) */-->
        <div th:if="${response.vote}" id="voteAdded" class="alert alert-warning fw-bold py-2 mt-4 mb-0" role="status"
             th:text="#{result.vote.added(${response.votes})}">Someone already asked for it — your vote is in!</div>
        <div th:if="${response.ownSong}" id="voteOwn" class="alert alert-info fw-bold py-2 mt-4 mb-0" role="status"
             th:text="#{result.vote.own(${response.votes})}">Your request for this song is already waiting.</div>

        <p class="mt-4 lead fst-italic text-light" th:text="${response.comment}">DJ's Comment</p>

        <!--/* the song's number (V28): the guest finds it in the list and writes it in the title of a tip */-->
        <p th:if="${response.requestNumber != null and response.decision == 'accepted'}" id="requestNumber" class="mt-3 mb-0 fw-bold"
           th:text="#{result.number(${'#' + response.requestNumber})}">Your song's number: #27</p>
        <!--/* the DJ's tip link (V27), only under a song that reached the DJ */-->
        <div th:if="${response.decision == 'accepted'}" class="mt-3">
            <p th:replace="~{fragments/components :: tip(${tipUrl}, ${response.requestNumber}, false)}"></p>
        </div>

        <!--/* the next step is the page's one action (filled); the tip above it is the second kind (the design review, 2026-10-09) */-->
        <a th:href="@{/p/{code}(code=${partyCode})}" class="btn btn-action btn-lg mt-4" th:text="#{result.button.suggest_another}">Suggest another one</a>
    </div>
</div>
<div th:replace="~{fragments/components :: footer}"></div>

</body>
</html>
