<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{result.title}">DJ's Verdict</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; display: flex; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; border-radius: 20px; border: 2px solid #333; }
        .accepted { color: #1DB954; } /* Spotify Green */
        .rejected { color: #ff4444; }
    </style>
</head>
<body>
<div class="container text-center">
    <div class="card p-5 shadow-lg text-white">

        <h2 class="mb-4 text-white" th:text="${response.songName}">Song Name</h2>
        <div th:class="${response.decision == 'accepted' ? 'accepted' : 'rejected'}">
            <h1 class="display-1 fw-bold"
                th:text="${response.decision == 'accepted'} ? #{result.decision.accepted} : #{result.decision.rejected}">
                STATUS
            </h1>
        </div>

        <p class="mt-4 lead fst-italic text-light" th:text="${response.comment}">DJ's Comment</p>

        <div class="mt-4">
            <span class="badge bg-secondary p-2">Energy: <span th:text="${response.energyLevel}">0</span>/10</span>
        </div>

        <a href="/" class="btn btn-outline-light mt-5" th:text="#{result.button.suggest_another}">Suggest another one</a>
    </div>
</div>
</body>
</html>
