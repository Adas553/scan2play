<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{landing.hero.title}">Scan2Play - Your Virtual DJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="page-landing">

<div class="container hero-section">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-4 fw-bold mb-4" th:text="#{landing.hero.title}">Scan2Play - Your Virtual DJ Assistant</h1>

            <p class="lead mb-5" th:text="#{landing.hero.subtitle}">
                Let your guests request music via QR code,
                while AI ensures the perfect party vibe.
            </p>

            <div class="provider-cards">
                <!-- Spotify: OAuth2 login flow -->
                <a href="/oauth2/authorization/spotify" class="provider-card text-center">
                    <div class="icon">🎵</div>
                    <div class="btn btn-spotify btn-lg w-100" th:text="#{landing.btn.start.spotify}">
                        Start Party with Spotify
                    </div>
                    <small class="text-secondary d-block mt-2" th:text="#{landing.hint.spotify}">Requires Spotify account</small>
                </a>

                <!-- YouTube: Google OAuth2 login flow -->
                <a href="/oauth2/authorization/google" class="provider-card text-center">
                    <div class="icon">▶️</div>
                    <div class="btn btn-youtube btn-lg w-100" th:text="#{landing.btn.start.youtube}">
                        Start Party with YouTube
                    </div>
                    <small class="text-secondary d-block mt-2" th:text="#{landing.hint.youtube}">Requires Google account</small>
                </a>
            </div>

            <div th:if="${param.error}" class="alert alert-danger mt-4" role="alert" th:text="#{landing.error.login}">
                Login failed. Please try again.
            </div>
        </div>
    </div>
</div>

</body>
</html>
