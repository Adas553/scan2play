<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan2Play - Your Virtual DJ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .hero-section {
            padding: 100px 0;
            text-align: center;
        }
        .btn-spotify {
            background-color: #1DB954;
            color: white;
            font-weight: bold;
            border: none;
        }
        .btn-spotify:hover {
            background-color: #1ed760;
            color: white;
        }
    </style>
</head>
<body>

<div class="container hero-section">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-4 fw-bold mb-4" th:text="#{landing.hero.title}">Scan2Play - Your Virtual DJ Assistant</h1>

            <p class="lead mb-5" th:text="#{landing.hero.subtitle}">
                Let your guests request music via QR code,
                while AI ensures the perfect party vibe.
            </p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <!-- Spring Security OAuth2 Login Endpoint -->
                <a href="/oauth2/authorization/spotify" class="btn btn-spotify btn-lg px-4 gap-3" th:text="#{landing.btn.login.spotify}">
                    Log in with Spotify
                </a>
            </div>

            <div th:if="${param.error}" class="alert alert-danger mt-4" role="alert" th:text="#{landing.error.login}">
                Login failed. Please try again.
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
