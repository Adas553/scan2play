<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan2Play - Your Virtual DJ</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .hero-section {
            padding: 100px 0;
            text-align: center;
        }
        .btn-spotify {
            background-color: #1DB954;
            color: white;
            font-weight: bold;
            border: none;
        }
        .btn-spotify:hover {
            background-color: #1ed760;
            color: white;
        }
        .btn-youtube {
            background-color: #FF0000;
            color: white;
            font-weight: bold;
            border: none;
        }
        .btn-youtube:hover {
            background-color: #cc0000;
            color: white;
        }
        .provider-cards {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .provider-card {
            padding: 2rem 2.5rem;
            border-radius: 16px;
            border: 2px solid #333;
            background: #1a1a1a;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            min-width: 220px;
        }
        .provider-card:hover {
            transform: translateY(-4px);
            border-color: #555;
        }
        .provider-card .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

<div class="container hero-section">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-4 fw-bold mb-4" th:text="#{landing.hero.title}">Scan2Play - Your Virtual DJ Assistant</h1>

            <p class="lead mb-5" th:text="#{landing.hero.subtitle}">
                Let your guests request music via QR code,
                while AI ensures the perfect party vibe.
            </p>

            <div class="provider-cards">
                <!-- Spotify: OAuth2 login flow -->
                <a href="/oauth2/authorization/spotify" class="provider-card text-center">
                    <div class="icon">🎵</div>
                    <div class="btn btn-spotify btn-lg w-100" th:text="#{landing.btn.start.spotify}">
                        Start Party with Spotify
                    </div>
                    <small class="text-secondary d-block mt-2" th:text="#{landing.hint.spotify}">Requires Spotify account</small>
                </a>

                <!-- YouTube: Google OAuth2 login flow -->
                <a href="/oauth2/authorization/google" class="provider-card text-center">
                    <div class="icon">▶️</div>
                    <div class="btn btn-youtube btn-lg w-100" th:text="#{landing.btn.start.youtube}">
                        Start Party with YouTube
                    </div>
                    <small class="text-secondary d-block mt-2" th:text="#{landing.hint.youtube}">Requires Google account</small>
                </a>
            </div>

            <div th:if="${param.error}" class="alert alert-danger mt-4" role="alert" th:text="#{landing.error.login}">
                Login failed. Please try again.
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
