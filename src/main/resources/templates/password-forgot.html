<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{account.forgot.title}">Forgot your password - Scan2Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" th:href="@{/css/app.css}" rel="stylesheet">
</head>
<!--/* "Nie pamiętam hasła" (V72): the address; then always "Sprawdź skrzynkę" — a link to a new password goes to an account's address,
     nothing to an address the app does not know (the page never says which). */-->
<body class="page-guest page-account">
<div class="container d-flex flex-column align-items-center">
    <div class="card p-4 shadow-lg w-100 text-white mb-4 s2p-mw-500">
        <h1 class="display-6 fw-bold text-center"><a th:replace="~{fragments/components :: home-logo}" href="/">Scan2Play</a></h1>
        <h2 class="h4 fw-bold mt-2 text-center" id="forgotHeading" th:text="#{account.forgot.heading}">Forgot your password?</h2>
        <p class="text-center text-secondary-bright" th:text="#{account.forgot.text}">We will e-mail you a link to set a new one.</p>

        <div th:if="${formError != null}" id="formError" class="alert alert-danger" role="alert" th:text="#{__${formError}__}">
            That is not an e-mail address.
        </div>

        <form th:action="@{/password/forgot}" method="post" id="forgotForm" class="m-0">
            <label for="forgotEmail" class="form-label" th:text="#{account.field.email}">E-mail address</label>
            <input type="email" id="forgotEmail" name="email" class="form-control mb-3" required maxlength="254" autocomplete="email"
                   th:value="${email}">
            <button type="submit" class="btn btn-action btn-lg w-100" th:text="#{account.forgot.submit}">Send the link</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="/login" th:text="#{account.back_to_login}">Back to the login</a></p>
    </div>
</div>
<div th:replace="~{fragments/components :: footer}"></div>
</body>
</html>
