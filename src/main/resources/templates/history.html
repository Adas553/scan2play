<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{history.title}">Party History - Scan2Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSRF Tokens for JavaScript requests -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <th:block th:replace="~{fragments/components :: scroll-restore-script}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer crossorigin="anonymous"></script>
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="page-dj">
<div class="container mt-3 mt-md-5 p-3 p-md-4">

    <!-- Navigation and Alert Fragment -->
    <div th:replace="~{fragments/components :: dj-nav(activeTab='history', isActive=${isActive}, partyCode=${partyCode})}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="#{history.title}">📜 Party History</h1>
        <div class="text-secondary small">
            Party Code: <span class="text-white fw-bold" th:text="${partyCode}">CODE</span>
        </div>
    </div>

    <!--/* The history list: a count, filter buttons (All / Guests / Playlist / Played / Rejected — the server filters, in
         its bounded queries, and the button of the model attribute historyFilter is the lit one) and a search box (which
         works on the rows that are there) above a list of fixed height with its own
         scrollbar (.list-scroll), and a "Show more" button when older requests exist. Used by the standalone page
         and, as an AJAX fragment, by the dashboard's History tab. dashboard.js (initListTools) does the filtering
         and "Show more"; the count carries the "+" that says there are older requests in data-suffix. */-->
    <div th:fragment="historyTableContent" class="mb-4" data-list
         th:with="activeFilter=${historyFilter != null ? historyFilter : 'all'}">
        <!--/* A heading only where the list arrives by itself under the dashboard's other panels (the History tab, model
             attribute historyHeading): the standalone page has its own h1 above. It tells the DJ what has just appeared. */-->
        <h4 th:if="${historyHeading}" class="text-white mb-2" th:text="#{history.title}">📜 Party History</h4>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <span class="badge text-bg-secondary" data-list-count
                      th:attr="data-suffix=${historyHasMore} ? '+' : ''"
                      th:text="${#lists.size(history)} + (${historyHasMore} ? '+' : '')">0</span>
                <!--/* Separate small buttons that wrap (a joined btn-group of five is wider than a phone) */-->
                <div class="d-flex flex-wrap gap-1" role="group">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-list-filter="all"
                            th:classappend="${activeFilter == 'all'} ? 'active'"
                            th:text="#{history.filter.all}">All</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-list-filter="guest"
                            th:classappend="${activeFilter == 'guest'} ? 'active'"
                            th:text="#{history.filter.guest}">Guests</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-list-filter="background"
                            th:classappend="${activeFilter == 'background'} ? 'active'"
                            th:text="#{history.filter.background}">Playlist</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-list-filter="played"
                            th:classappend="${activeFilter == 'played'} ? 'active'"
                            th:text="#{history.filter.played}">Played</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-list-filter="rejected"
                            th:classappend="${activeFilter == 'rejected'} ? 'active'"
                            th:text="#{history.filter.rejected}">Rejected</button>
                </div>
            </div>
            <input type="search" data-list-search class="form-control form-control-sm bg-black text-light border-secondary"
                   style="max-width: 16rem;" th:placeholder="#{dashboard.list.search}" autocomplete="off">
        </div>
        <div class="table-responsive list-scroll">
        <table class="table table-dark table-hover table-sm align-middle">
            <thead>
            <tr>
                <th class="d-none d-md-table-cell" data-sort="time" th:text="#{dashboard.table.header.time}">Time</th>
                <th data-sort="song" th:text="#{dashboard.table.header.song}">Song</th>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.vibe}">Vibe</th>
                <th>
                    <span class="d-none d-md-inline" th:text="#{dashboard.table.header.decision}">Status</span>
                    <span class="d-inline d-md-none">AI</span>
                </th>
                <th class="d-none d-lg-table-cell" th:text="#{dashboard.table.header.comment}">DJ's Comment</th>
                <th class="d-none d-md-table-cell" data-sort="energy" th:text="#{dashboard.table.header.energy}">Energy</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req : ${history}" th:attr="data-song-name=${req.title},data-decision=${req.decision}"
                th:with="shownAt=${T(com.scan2play.util.Times).display(req.at)},sortAt=${T(com.scan2play.util.Times).sortKey(req.at)}">
                <td class="text-secondary d-none d-md-table-cell" data-sort-value="time" th:attr="data-val=${sortAt}" th:text="${shownAt}">12:00</td>
                <td data-sort-value="song" th:attr="data-val=${req.title}">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
                        <span class="fw-bold text-break">
                            <span th:if="${req.source.name() != 'GUEST'}" th:title="#{history.source.background}">🎶</span>
                            <span th:text="${req.title}">Song</span>
                        </span>
                        <a th:if="${req.trackUrl != null}"
                           th:href="${req.trackUrl}"
                           target="_blank"
                           class="btn btn-sm btn-secondary shadow-sm fw-bold flex-shrink-0"
                           style="font-size: 0.7rem;">
                            LINK
                        </a>
                    </div>
                </td>
                <td class="d-none d-md-table-cell">
                    <span th:if="${req.source.name() == 'GUEST'}" class="badge text-bg-secondary" th:text="${req.style}">Style</span>
                    <span th:unless="${req.source.name() == 'GUEST'}" class="badge text-bg-dark border border-secondary"
                          th:text="#{history.source.background}">Playlist</span>
                </td>
                <td th:classappend="${req.decision == 'accepted' ? 'status-accepted' : (req.decision == 'rejected' ? 'status-rejected' : 'status-played')}">
                    <span class="d-none d-md-inline" th:text="${req.decision == 'played' ? #messages.msg('dashboard.table.status.played') : (req.decision == 'accepted' ? #messages.msg('dashboard.table.status.accepted') : (req.decision == 'rejected' ? #messages.msg('dashboard.table.status.rejected') : req.decision))}">Decision</span>
                    <span class="d-inline d-md-none" th:text="${req.decision == 'played' ? '▶' : (req.decision == 'accepted' ? '✔' : (req.decision == 'rejected' ? '✖' : req.decision))}" style="font-size: 1.2rem;"></span>
                </td>
                <td class="d-none d-lg-table-cell fst-italic text-secondary text-wrap" style="min-width: 200px;" th:text="${req.djComment}">Comment</td>
                <td class="d-none d-md-table-cell" data-sort-value="energy" th:attr="data-val=${req.energyLevel != null ? req.energyLevel : 0}">
                    <span th:if="${req.energyLevel != null}" class="badge-energy" th:text="${req.energyLevel + '/10'}">10/10</span>
                    <span th:if="${req.energyLevel == null}" class="text-secondary">—</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(history)}">
                <td colspan="6" class="text-center text-light py-4" style="background: #232323;" th:text="#{history.empty}">History is empty.</td>
            </tr>
            <tr data-nomatch class="d-none">
                <td colspan="6" class="text-center text-secondary py-3" style="background: #232323;" th:text="#{dashboard.list.nomatch}">Nothing matches.</td>
            </tr>
            </tbody>
        </table>
        </div>
        <div th:if="${historyHasMore}" class="text-center mt-2">
            <button type="button" class="btn btn-sm btn-outline-light" data-history-more
                    th:attr="data-limit=${historyNextLimit}" th:text="#{history.more}">Show more</button>
        </div>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <a href="/dj/dashboard" class="btn btn-outline-light" th:text="#{history.back.to.dashboard}">Back to Dashboard</a>
    </div>
</div>

<!-- The dashboard's list tools: sorting, search, filters and "Show more" (it sets up the table's headers itself) -->
<script type="module" src="/js/dashboard/list-tools.js"></script>

<div th:replace="~{fragments/components :: footer}"></div>

</body>
</html>
