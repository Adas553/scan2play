<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Party History - Scan2Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0b0b; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { background: #161616; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #fff; font-weight: 700; font-size: 1.8rem; }
        .status-accepted { color: #1DB954 !important; font-weight: bold; text-transform: uppercase; }
        .status-rejected { color: #ff4444 !important; font-weight: bold; text-transform: uppercase; }
        .status-played { color: #0dcaf0 !important; font-weight: bold; text-transform: uppercase; }
        .table { border-color: #333; }
        .badge-energy { background: #333; color: #fff; padding: 5px 10px; border-radius: 20px; border: 1px solid #444; }
        .nav-link { color: #aaa; font-weight: 600; }
        .nav-link.active {
            color: #1DB954 !important;
            background-color: #232323 !important;
            border-bottom: 2px solid #1DB954;
            border-radius: 8px 8px 0 0;
        }
        .nav-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="container mt-3 mt-md-5 p-3 p-md-4">

    <!-- Navigation and Alert Fragment -->
    <div th:replace="~{fragments/components :: dj-nav(activeTab='history', isActive=${isActive})}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="#{history.title}">📜 Party History</h1>
        <div class="text-secondary small">
            Party Code: <span class="text-white fw-bold" th:text="${partyCode}">CODE</span>
        </div>
    </div>

    <div class="table-responsive mb-4">
        <table class="table table-dark table-hover align-middle">
            <thead>
            <tr>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.time}">Time</th>
                <th th:text="#{dashboard.table.header.song}">Song</th>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.vibe}">Vibe</th>
                <th th:text="#{dashboard.table.header.decision}">Status</th>
                <th class="d-none d-lg-table-cell" th:text="#{dashboard.table.header.comment}">DJ's Comment</th>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.energy}">Energy</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req : ${history}">
                <td class="text-secondary d-none d-md-table-cell" th:text="${#temporals.format(req.requestedAt, 'dd.MM.yyyy HH:mm:ss')}">12:00</td>
                <td>
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
                        <span class="fw-bold text-break" th:text="${req.songName}">Song</span>
                        <a th:if="${req.trackUrl != null}"
                           th:href="${req.trackUrl}"
                           target="_blank"
                           class="btn btn-sm btn-secondary shadow-sm fw-bold flex-shrink-0"
                           style="font-size: 0.7rem;">
                            LINK
                        </a>
                    </div>
                </td>
                <td class="d-none d-md-table-cell"><span class="badge text-bg-secondary" th:text="${req.style}">Style</span></td>
                <td th:classappend="${req.decision == 'accepted' ? 'status-accepted' : (req.decision == 'rejected' ? 'status-rejected' : 'status-played')}"
                    th:text="${req.decision == 'played'} ? #{dashboard.table.status.played} : ${req.decision}">Decision</td>
                <td class="d-none d-lg-table-cell fst-italic text-secondary text-wrap" style="min-width: 200px;" th:text="${req.djComment}">Comment</td>
                <td class="d-none d-md-table-cell"><span class="badge-energy" th:text="${req.energyLevel + '/10'}">10/10</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(history)}">
                <td colspan="6" class="text-center text-light py-4" style="background: #232323;" th:text="#{history.empty}">History is empty.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <a href="/dj/dashboard" class="btn btn-outline-light" th:text="#{history.back.to.dashboard}">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
