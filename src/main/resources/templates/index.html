<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{home.title}">Scan2Play - Request a Song</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 15px; width: 100%; max-width: 500px; }
        .btn-success { background: #1DB954; border: none; } /* Spotify Green */
        .btn-success:hover { background: #1ed760; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="card p-4 shadow-lg w-100 text-white">
        <h1 class="mb-4 text-center" th:text="#{home.title}">🎵 Scan2Play</h1>

        <p class="text-white-50 text-center" th:text="#{home.subtitle}">What do you want to hear?</p>

        <form action="/request" method="POST" class="p-3 border border-secondary rounded bg-dark text-light">
            <div class="mb-4">
                <label for="songInput" class="form-label fw-bold" th:text="#{home.form.input.label}">Your choice</label>
                <input type="text" id="songInput" name="songName" class="form-control" required>
                <div class="form-text text-white-50 mt-2" th:text="#{home.form.input.help}">Provide a title, artist, or just describe your mood!</div>
            </div>

            <div class="mb-4" th:if="${globalVibe.name() == 'ANY'}">
                <label for="styleInput" class="form-label fw-bold" th:text="#{home.form.vibe.label}">Choose the vibe (optional)</label>
                <select id="styleInput" name="style" class="form-select">
                    <option value="Auto (Zaufaj AI)" selected th:text="#{party.vibe.trust_ai}">✨ Trust AI</option>
                    <option value="Pop / Dance" th:text="#{home.form.vibe.option.pop}">Pop / Dance</option>
                    <option value="Rock / Alternatywa" th:text="#{home.form.vibe.option.rock}">Rock / Alternative</option>
                    <option value="Rap / Hip-Hop" th:text="#{home.form.vibe.option.rap}">Rap / Hip-Hop</option>
                    <option value="Chillout / Jazz" th:text="#{home.form.vibe.option.chill}">Chillout / Jazz</option>
                </select>
            </div>

            <div class="mb-4" th:unless="${globalVibe.name() == 'ANY'}">
                <div class="alert alert-warning text-dark text-center fw-bold shadow-sm">
                    <span th:text="#{party.vibe.alert}">🛑 WARNING: The DJ forced the vibe:</span><br>
                    <span class="fs-4 text-uppercase" th:text="#{vibe.__${globalVibe}__}">JAZZ</span>
                </div>
                <input type="hidden" name="style" th:value="#{vibe.__${globalVibe}__}">
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm py-2" th:text="#{home.form.button.submit}">Send to DJ!</button>
        </form>
    </div>
</div>
</body>
</html>
