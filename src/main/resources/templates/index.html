<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{home.title}">Scan2Play - Request a Song</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- a dark page already: a browser's own dark mode (Samsung Internet) must not darken it again — it greyed our logo -->
    <meta name="color-scheme" content="dark">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="page-guest">
<div class="container d-flex flex-column align-items-center">

    <div th:replace="~{fragments/components :: back-to-dashboard}"></div>

    <!--/* The party page in the order a guest uses it (the design review, 2026-10-09: the field came only after the profiles and the
         tip): who plays, the vibe in one quiet line, the field and "Wyślij prośbę", the list — and the DJ's profiles and tip under it. */-->
    <div class="card p-4 shadow-lg w-100 text-white mb-4">
        <div class="text-center mb-3">
            <h1 class="display-5 fw-bold mb-2"><th:block th:replace="~{fragments/components :: logo}"></th:block></h1>
            <!--/* Who plays, as the DJ wrote it (V17) */-->
            <p th:if="${djName != null}" id="djName" class="fs-5 fw-bold mb-1" th:text="#{party.dj(${djName})}">🎧 Gra: DJ Koko</p>
            <!--/* The party's vibe as the DJ set it: the vibe of the list (when not "any") and the DJ's own words (V16) — a line of
                 text, not a box: it tells the guest what fits, the form is what they came for */-->
            <p class="mb-0 s2p-party-vibe" id="partyVibe" th:if="${vibeNote != null or globalVibe.name() != 'ANY'}">
                <span class="text-secondary" th:text="#{party.vibe.title}">Tonight's vibe</span><span class="text-secondary">:</span><th:block
                    th:if="${globalVibe.name() != 'ANY'}"> <span id="partyVibeName" class="fw-semibold" th:text="#{vibe.__${globalVibe}__}">Club & EDM</span></th:block><th:block
                    th:if="${vibeNote != null}"> <span id="vibeNote" class="fst-italic" th:text="${vibeNote}">40+ wedding, Polish hits, no rap</span></th:block>
            </p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger text-center fw-bold" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Dynamic form action based on party code -->
        <form id="requestForm" th:action="@{/p/{partyCode}/request(partyCode=${partyCode})}" method="POST" class="m-0">

            <!-- Hidden Party Code Input -->
            <input type="hidden" name="partyCode" th:value="${partyCode}" />

            <!--/* A specific song: the artist and the title (the owner, 2026-10-16: the page promises no song found by a line of its lyrics —
                 the AI still tries; the DJ sets the mood). A request the AI reads as a mood
                 comes back here with its text (lastRequest), asking for a song. The question is the field's label. */-->
            <div class="mb-3">
                <label for="songInput" class="form-label fw-bold fs-5" th:text="#{home.subtitle}">What do you want to hear?</label>
                <div class="song-autocomplete-wrapper">
                    <!--/* the placeholder in the suggestions' own format ("Artist – Title", song-autocomplete.js) — the owner, 2026-10-07 */-->
                    <input type="text" id="songInput" name="songName" class="form-control form-control-lg" required
                           data-autocomplete="songs" th:value="${lastRequest}" th:placeholder="#{home.form.input.placeholder}">
                    <!-- Dropdown injected here by song-autocomplete.js -->
                </div>
                <div id="songInputHelp" class="form-text text-secondary mt-2"
                     th:text="#{home.form.input.help.song}">A title, an artist or a line of the lyrics</div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-action btn-lg w-100"
                    th:attr="data-text-submitting=#{home.form.button.submitting}">
                <span id="submitBtnText" th:text="#{home.form.button.submit}">Send to DJ!</span>
            </button>
        </form>
    </div>

    <!--/* The requests as a guest sees them (GuestQueueService): whether the guest's own song waits, the most wanted songs and the
         requests sent lately — the guest's own marked. */-->
    <div id="guestQueueBox" class="w-100 s2p-mw-500"
         th:attr="data-url=@{/p/{code}/queue(code=${partyCode})},data-text-failed=#{guest.queue.failed}">
        <div th:replace="~{fragments/guest-queue :: guestQueue}"></div>
    </div>

    <!--/* The DJ's profiles (V24) and tip link (V27), under the list: only https addresses on those sites, as SocialLinks and TipLinks
         wrote them (the buttons: the fragment djLinks) */-->
    <div th:if="${instagramUrl != null or facebookUrl != null or tiktokUrl != null or tipUrl != null}"
         class="w-100 s2p-mw-500 text-center mt-4 s2p-support" id="djSupport">
        <p th:replace="~{fragments/components :: djLinks(${instagramUrl}, ${facebookUrl}, ${tiktokUrl})}"></p>
        <p th:replace="~{fragments/components :: tip(${tipUrl}, null, true)}"></p>
    </div>

</div>

<script src="/js/guest-party.js" th:src="@{/js/guest-party.js}"></script>

<script src="/js/song-autocomplete.js" th:src="@{/js/song-autocomplete.js}"></script>

<div th:replace="~{fragments/components :: footer}"></div>

</body>
</html>
