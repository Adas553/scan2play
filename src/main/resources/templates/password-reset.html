<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="#{html.lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{account.reset.title}">A new password - Scan2Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <!-- a secret link: no search engine, and no Referer that would carry it to another site -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link href="/webjars/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" th:href="@{/css/app.css}" rel="stylesheet">
</head>
<!--/* The new password's link of the e-mail (V72): valid an hour, once. The new password ends the account's other sessions and logs
     this one in. */-->
<body class="page-guest page-account">
<div class="container d-flex flex-column align-items-center">
    <div class="card p-4 shadow-lg w-100 text-white mb-4 s2p-mw-500">
        <h1 class="display-6 fw-bold text-center"><th:block th:replace="~{fragments/components :: logo}"></th:block></h1>
        <h2 class="h4 fw-bold mt-2 text-center" id="resetHeading" th:text="#{account.reset.heading}">Set a new password</h2>
        <p class="text-center text-secondary-bright" th:text="#{account.reset.text(${email})}">For ola@example.com.</p>

        <div th:if="${formError != null}" id="formError" class="alert alert-danger" role="alert"
             th:text="#{__${formError}__(${T(com.scan2play.service.PasswordAccountService).PASSWORD_MIN}, ${T(com.scan2play.service.PasswordAccountService).PASSWORD_MAX})}">
            The password needs at least 8 characters.
        </div>

        <form th:action="@{/password/reset}" method="post" id="resetForm" class="m-0">
            <input type="hidden" name="token" th:value="${token}">
            <input type="email" name="email" class="d-none" th:value="${email}" autocomplete="username" tabindex="-1" aria-hidden="true">
            <label for="resetPassword" class="form-label" th:text="#{account.field.new_password}">New password</label>
            <input type="password" id="resetPassword" name="password" class="form-control" required minlength="8" maxlength="64"
                   autocomplete="new-password" aria-describedby="resetPasswordHint">
            <p class="form-text text-secondary-bright mb-3" id="resetPasswordHint"
               th:text="#{account.password.hint(${T(com.scan2play.service.PasswordAccountService).PASSWORD_MIN})}">At least 8 characters.</p>
            <button type="submit" class="btn btn-action btn-lg w-100" th:text="#{account.reset.submit}">Save and log in</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/components :: footer}"></div>
</body>
</html>
