<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{dashboard.title}">DJ Dashboard - Scan2Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSRF Tokens for JavaScript requests -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <th:block th:replace="~{fragments/components :: scroll-restore-script}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0b0b; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { background: #161616; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #fff; font-weight: 700; font-size: 1.8rem; }
        .status-accepted { color: #1DB954 !important; font-weight: bold; text-transform: uppercase; }
        .status-rejected { color: #ff4444 !important; font-weight: bold; text-transform: uppercase; }
        .status-played { color: #0dcaf0 !important; font-weight: bold; text-transform: uppercase; } /* Cyan for Played */
        .table { border-color: #333; } /* Removed white-space: nowrap to allow wrapping on mobile if needed */
        .btn-success { background-color: #1DB954; border: none; font-weight: 600; }
        .btn-success:hover { background-color: #1ed760; }
        .badge-energy { background: #333; color: #fff; padding: 5px 10px; border-radius: 20px; border: 1px solid #444; }
        .nav-link { color: #aaa; font-weight: 600; }
        .nav-link.active {
            color: #1DB954 !important;
            background-color: #232323 !important;
            border-bottom: 2px solid #1DB954;
            border-radius: 8px 8px 0 0;
        }
        .nav-link:hover { color: #fff; }

        .qr-card-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 370px;
        }
    </style>
</head>
<body>
<div class="container mt-3 mt-md-5 p-3 p-md-4">

    <!-- Navigation and Alert Fragment -->
    <div th:replace="~{fragments/components :: dj-nav(activeTab='queue', isActive=${isActive})}"></div>

    <div class="row mb-4">
        <div class="col-md-8">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                <h1 class="mb-0 text-center text-md-start" th:text="#{dashboard.title}">🎧 DJ Dashboard</h1>

                <div class="bg-dark p-2 rounded border border-secondary w-100" style="max-width: 350px;">
                    <form th:action="@{/dj/dashboard/vibe}" method="POST" class="m-0 d-flex align-items-center">
                        <input type="hidden" id="partyCode" name="partyCode" th:value="${partyCode}">
                        <label for="vibeSelect" class="me-2 fw-bold text-light small text-nowrap" th:text="#{dashboard.vibe.label}">🌍 Global Vibe:</label>
                        <select id="vibeSelect" name="newVibe" class="form-select form-select-sm bg-black text-light border-secondary" onchange="this.form.submit()">
                            <option th:each="vibe : ${T(com.scan2play.model.VibeType).values()}"
                                    th:value="${vibe}"
                                    th:text="#{vibe.__${vibe}__}"
                                    th:selected="${vibe == globalVibe}">
                            </option>
                        </select>
                    </form>
                </div>
            </div>

            <div class="card bg-dark border-secondary mb-4 p-3 shadow-sm">
                <div class="row align-items-center">
                    <div class="col-md-6 mb-3 mb-md-0 d-flex align-items-center">
                        <span class="fw-bold text-light me-3" th:text="#{dashboard.provider.label}">🎵 Playback source:</span>
                        <span class="badge fs-6 px-3 py-2"
                              th:classappend="${activeProvider.name() == 'SPOTIFY' ? 'bg-success' : 'bg-danger'}"
                              th:text="${activeProvider.name() == 'SPOTIFY' ? 'Spotify' : 'YouTube'}">Spotify</span>
                    </div>
                    <div th:if="${activeProvider.name() == 'SPOTIFY'}" class="col-md-6 d-flex justify-content-md-end align-items-center">
                        <!-- If Spotify is not connected, show a button to connect -->
                        <a th:if="${!isSpotifyConnected}" th:href="@{/spotify/login(partyCode=${partyCode})}" class="btn btn-success">
                            Connect Spotify for Auto-Pilot
                        </a>

                        <!-- If Spotify is connected, show the Auto-Pilot toggle -->
                        <form th:if="${isSpotifyConnected}" th:action="@{/dj/dashboard/playback-mode}" method="POST" class="d-inline" id="autoPilotForm">
                            <input type="hidden" name="partyCode" th:value="${partyCode}">
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="autoSpotify"
                                       onchange="this.form.submit()"
                                       th:checked="${playbackMode == T(com.scan2play.model.PlaybackMode).AUTO}">
                                <label class="form-check-label fw-bold" for="autoSpotify" style="color: #1DB954">Auto-Pilot (Queue)</label>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card bg-dark border-secondary mb-4 p-3 shadow-sm">
                <form th:action="@{/dj/dashboard/limits}" method="POST" class="row align-items-end mx-0">
                    <input type="hidden" name="partyCode" th:value="${partyCode}">
                    <div class="col-md-3 mb-3 mb-md-0">
                        <label for="requestLimit" class="form-label text-light fw-bold" th:text="#{dashboard.ratelimit.limit}">Max requests per user:</label>
                        <input type="number" id="requestLimit" name="requestLimit" class="form-control bg-black text-light border-secondary" min="1" step="1" th:value="${requestLimit}" required>
                    </div>
                    <div class="col-md-3 mb-3 mb-md-0">
                        <label for="cooldownMinutes" class="form-label text-light fw-bold" th:text="#{dashboard.ratelimit.cooldown}">Cooldown (minutes):</label>
                        <input type="number" id="cooldownMinutes" name="cooldownMinutes" class="form-control bg-black text-light border-secondary" min="1" step="1" th:value="${cooldownMinutes}" required>
                    </div>
                    <div class="col-md-4 mb-3 mb-md-0">
                        <label for="duplicateCheckWindow" class="form-label text-light fw-bold" th:text="#{dashboard.limits.duplicates}">Block duplicates for last X songs:</label>
                        <input type="number" id="duplicateCheckWindow" name="duplicateCheckWindow" class="form-control bg-black text-light border-secondary" min="0" step="1" th:value="${duplicateCheckWindow}" required>
                    </div>
                    <div class="col-md-2 mt-2 mt-md-0 px-md-1">
                        <button type="submit" class="btn btn-outline-light w-100" th:text="#{dashboard.ratelimit.save}">Save</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- QR Code Section -->
        <div class="col-md-4 text-center">
            <div class="card bg-dark border-secondary p-3 shadow-sm qr-card-center">
                <h5 class="text-light mb-3" th:text="#{dashboard.qr.title}">Scan to Request Songs</h5>
                <img th:if="${qrCodeBase64}"
                     th:src="${'data:image/png;base64,' + qrCodeBase64}"
                     th:alt="#{dashboard.qr.alt}"
                     class="img-fluid rounded border border-light"
                     style="max-width: 200px; height: auto;" />

                 <!-- Permanent Link Section -->
                <div class="mt-3">
                    <p class="text-secondary mb-1 small" th:text="#{dashboard.qr.link}">Your Party Link:</p>
                    <div class="input-group input-group-sm mb-2">
                        <input type="text" class="form-control bg-dark text-light border-secondary"
                               th:value="${permanentLink}" id="partyLinkInput" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="copyPartyLink()" th:text="#{dashboard.qr.copy}" th:attr="data-copied=#{dashboard.qr.copied}">
                            Copy
                        </button>
                    </div>
                </div>

                <p class="text-secondary mt-2 small" th:text="#{dashboard.qr.help}">Direct guests to scan this code.</p>
            </div>
        </div>
    </div>

    <div class="table-responsive mb-4">
        <h4 class="text-white mb-3" th:text="#{dashboard.active.queue}">Active Queue</h4>
        <table class="table table-dark table-hover align-middle">
            <thead>
            <tr>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.time}">Time</th>
                <th th:text="#{dashboard.table.header.song}">Song</th>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.vibe}">Vibe</th>
                <th>
                    <span class="d-none d-md-inline" th:text="#{dashboard.table.header.decision}">AI Verdict</span>
                    <span class="d-inline d-md-none">AI</span>
                </th>
                <th class="d-none d-lg-table-cell" th:text="#{dashboard.table.header.comment}">DJ's Comment</th>
                <th class="d-none d-md-table-cell" th:text="#{dashboard.table.header.energy}">Energy</th>
                <th th:text="#{dashboard.table.header.action}">Action</th>
            </tr>
            </thead>
            <tbody id="song-list" th:fragment="songTableBody">
            <tr th:each="req : ${history}">
                <td class="text-secondary d-none d-md-table-cell" th:text="${#temporals.format(req.requestedAt, 'dd.MM.yyyy HH:mm:ss')}">12:00</td>
                <td>
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2">
                        <span class="fw-bold text-break" style="max-width: 100%;" th:text="${req.songName}">Song</span>
                        <a th:if="${req.trackUrl != null}"
                           th:href="${req.trackUrl}"
                           target="_blank"
                           class="btn btn-sm shadow-sm fw-bold flex-shrink-0"
                           th:classappend="${#strings.contains(req.trackUrl, 'spotify') ? 'btn-success text-dark' : (#strings.contains(req.trackUrl, 'youtube') ? 'btn-danger text-white' : 'btn-secondary')}"
                           th:text="${#strings.contains(req.trackUrl, 'spotify') ? '▶ SPOTIFY' : (#strings.contains(req.trackUrl, 'youtube') ? '▶ YOUTUBE' : '▶ PLAY')}">
                        </a>
                    </div>
                </td>
                <td class="d-none d-md-table-cell"><span class="badge text-bg-secondary" th:text="${req.style}">Style</span></td>
                <td th:classappend="${req.decision == 'accepted' ? 'status-accepted' : (req.decision == 'rejected' ? 'status-rejected' : 'status-played')}">
                    <span class="d-none d-md-inline" th:text="${req.decision == 'played' ? #messages.msg('dashboard.table.status.played') : (req.decision == 'accepted' ? #messages.msg('dashboard.table.status.accepted') : (req.decision == 'rejected' ? #messages.msg('dashboard.table.status.rejected') : req.decision))}">Decision</span>
                    <span class="d-inline d-md-none" th:text="${req.decision == 'played' ? '▶' : (req.decision == 'accepted' ? '✔' : (req.decision == 'rejected' ? '✖' : req.decision))}" style="font-size: 1.2rem;"></span>
                </td>
                <td class="d-none d-lg-table-cell fst-italic text-secondary text-wrap" style="min-width: 200px;" th:text="${req.djComment}">Comment</td>
                <td class="d-none d-md-table-cell"><span class="badge-energy" th:text="${req.energyLevel + '/10'}">10/10</span></td>
                <td>
                    <div class="d-flex gap-2">
                        <form th:if="${req.decision == 'accepted'}" th:action="@{/dj/dashboard/play}" method="post" class="m-0">
                            <input type="hidden" name="id" th:value="${req.id}" />
                            <button type="submit" class="btn btn-sm btn-outline-info" th:text="#{dashboard.table.button.mark_played}">Mark Played</button>
                        </form>

                        <!-- Send to Spotify Button (Only if Spotify is connected and active provider, and trackUrl contains 'spotify') -->
                        <form th:if="${req.decision == 'accepted' and activeProvider.name() == 'SPOTIFY' and isSpotifyConnected and #strings.contains(req.trackUrl, 'spotify')}"
                              th:action="@{/dj/requests/{id}/push-to-spotify(id=${req.id})}" method="post" class="m-0">
                             <button type="submit" class="btn btn-sm btn-outline-success" th:title="#{dashboard.button.push_to_spotify}">
                                🎵 <span th:text="#{dashboard.button.spotify}">Spotify</span>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(history)}">
                <td colspan="7" class="text-center text-light py-4" style="background: #232323;" th:text="#{dashboard.empty.queue}">No pending requests. Queue is empty! 🎵</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>

    async function refreshTable() {
        try {
            const partyCodeElement = document.getElementById('partyCode');
            if (partyCodeElement) {
                const partyCode = partyCodeElement.value;

                // Read CSRF tokens from meta tags
                const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                const response = await fetch(`/dj/dashboard/updates?partyCode=${partyCode}`, {
                    method: 'GET',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                });

                // Check if the response was redirected (e.g., to login page due to session expiry)
                if (response.redirected) {
                    window.location.reload(); // Reload the page to handle login properly
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                const html = await response.text();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                // If the fragment includes the tbody tag itself, we should extract its inner HTML
                // Or simply use the returned tbody to replace the old one
                const newTbody = tempDiv.querySelector('#song-list');
                if (newTbody) {
                    document.getElementById('song-list').replaceWith(newTbody);
                } else {
                    document.getElementById('song-list').innerHTML = html;
                }
            }
        } catch (error) {
            console.error('Refresh error:', error);
        } finally {
            // Re-schedule the next refresh only after the current one finishes
            setTimeout(refreshTable, 5000);
        }
    }
    // Start the loop
    setTimeout(refreshTable, 5000);

    function copyPartyLink() {
        var copyText = document.getElementById("partyLinkInput");
        copyText.select();
        copyText.setSelectionRange(0, 99999); // For mobile devices
        navigator.clipboard.writeText(copyText.value).then(() => {
            // Show localized feedback
            const btn = copyText.nextElementSibling;
            const originalText = btn.innerText;
            const copiedText = btn.getAttribute('data-copied') || 'Copied!';
            btn.innerText = copiedText;
            setTimeout(() => btn.innerText = originalText, 2000);
        });
    }
</script>

</body>
</html>
