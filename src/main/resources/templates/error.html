<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.page.title}">Oops – Scan2Play</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f1a; color: #d0d0d0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .card { background-color: #1c1c38; border: 1px solid #4a4a70; box-shadow: 0 0 50px rgba(120,120,255,0.12); border-radius: 20px; }
        h2 { color: #ffffff; }
        p.desc { color: #b0b8d0; }
        .btn-home { background-color: #5a5aaa; border: none; color: #fff; }
        .btn-home:hover { background-color: #7070cc; color: #fff; }
        .error-code { color: #7a7a9a; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="col-md-6 mx-auto">
        <div class="card p-5">

            <!-- 403 – session expired or access denied -->
            <th:block th:if="${status == 403}">
                <h1 class="display-1 mb-3">🔒</h1>
                <h2 class="mb-3 fw-bold" th:text="#{error.403.title}">Access Denied</h2>
                <p class="desc" th:text="#{error.403.description}">Your session may have expired or the party is no longer accepting requests.</p>
            </th:block>

            <!-- 404 – invalid party code or unknown page -->
            <th:block th:if="${status == 404}">
                <h1 class="display-1 mb-3">🔍</h1>
                <h2 class="mb-3 fw-bold" th:text="#{error.404.title}">Page Not Found</h2>
                <p class="desc" th:text="#{error.404.description}">That party code doesn't exist or the link is incorrect.</p>
            </th:block>

            <!-- 5xx and everything else -->
            <th:block th:unless="${status == 403 or status == 404}">
                <h1 class="display-1 mb-3">😵</h1>
                <h2 class="mb-3 fw-bold" th:text="#{error.generic.title}">Something went wrong</h2>
                <p class="desc" th:text="#{error.generic.description}">An unexpected error occurred. Please try again in a moment.</p>
            </th:block>

            <p class="error-code mt-2">
                <span th:text="#{error.code.label}">Error</span> <span th:text="${status}">???</span>
            </p>
            <div class="mt-4">
                <a href="/" class="btn btn-home btn-lg px-5" th:text="#{error.btn.home}">Go Home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
