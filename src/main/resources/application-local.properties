# The developer's machine: run with the profile "local" (IntelliJ: Run configuration → Active profiles: local, or the environment
# variable SPRING_PROFILES_ACTIVE=local). The local PostgreSQL's user and password unless PGUSER / PGPASSWORD are set.
# Never used in production: there the variables are required (application.properties, review 5.5).
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:1111}
