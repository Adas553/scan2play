# Terms of Service Page (terms.html)
# ==============================================================================
terms.title=Terms of Service
terms.last_updated=Last updated: April 2026
terms.btn.home=Go Home
terms.section1.title=1. Acceptance of Terms
terms.section1.text=By accessing and using Scan2Play (scan2play.com.pl), you agree to these Terms of Service. If you do not agree, please do not use the service.
terms.section2.title=2. Description of Service
terms.section2.text=Scan2Play is an AI-powered music request platform for events. DJs create party sessions, guests request songs via QR code, and AI evaluates whether each request fits the party vibe. Music is played through YouTube or Spotify.
terms.section3.title=3. User Responsibilities
terms.section3.item1=You must not submit offensive, harmful, or illegal content in song requests or feedback.
terms.section3.item2=DJs are responsible for the content played at their events.
terms.section3.item3=You must not attempt to abuse, overload, or interfere with the service.
terms.section4.title=4. Third-Party Services
terms.section4.text=Scan2Play uses YouTube API Services for music search and playback. By using this application, you agree to be bound by the <a href="https://www.youtube.com/t/terms" target="_blank" class="text-warning">YouTube Terms of Service</a>. Please also review the <a href="https://policies.google.com/privacy" target="_blank" class="text-warning">Google Privacy Policy</a>. If you use Spotify integration, you also agree to the <a href="https://www.spotify.com/legal/end-user-agreement/" target="_blank" class="text-warning">Spotify Terms of Use</a>.
terms.section5.title=5. Account Termination
terms.section5.text=You may delete your account and all associated data at any time from the DJ Dashboard. We reserve the right to suspend or terminate accounts that violate these terms.
terms.section6.title=6. Disclaimer
terms.section6.text=Scan2Play is provided "as is" without warranties of any kind. We are not responsible for music licensing \u2014 DJs are responsible for ensuring they have the right to play music at their events.
terms.section7.title=7. Changes to Terms
terms.section7.text=We may update these Terms at any time. Continued use of Scan2Play after changes constitutes acceptance of the new terms.
terms.section8.title=8. Contact
terms.section8.text=For questions about these Terms, contact us at: <strong>contact@scan2play.com.pl</strong>

