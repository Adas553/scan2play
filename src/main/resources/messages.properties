# ==============================================================================
# Privacy Policy Page (privacy.html)
# ==============================================================================
privacy.title=Privacy Policy
privacy.last_updated=Last updated: April 2026
privacy.btn.home=Go Home
privacy.section1.title=1. Introduction
privacy.section1.text=Scan2Play ("we", "us", "our") is an AI-powered music request platform for events. This Privacy Policy explains how we collect, use, and protect your data when you use our service at scan2play.com.pl.
privacy.section2.title=2. Data We Collect
privacy.section2.dj.title=For DJs (registered users):
privacy.section2.dj.item1=Google account profile information (name, email, profile picture) via OAuth 2.0
privacy.section2.dj.item2=Spotify account information (user ID, display name) if Spotify integration is used
privacy.section2.dj.item3=Party settings and configuration preferences
privacy.section2.dj.item4=Feedback messages submitted through the dashboard
privacy.section2.guest.title=For Guests (anonymous users):
privacy.section2.guest.item1=Song request text (artist/title/description)
privacy.section2.guest.item2=Session identifiers for rate limiting (no personal data)
privacy.section3.title=3. How We Use Your Data
privacy.section3.item1=To authenticate DJs and manage party sessions
privacy.section3.item2=To process song requests and provide AI-powered music evaluation
privacy.section3.item3=To search for music via YouTube Data API v3 and Spotify API
privacy.section3.item4=To enforce rate limits and prevent abuse
privacy.section4.title=4. YouTube API Services
privacy.section4.text=This application uses YouTube API Services to search for and play music videos. By using Scan2Play, you agree to be bound by the <a href="https://www.youtube.com/t/terms" target="_blank" class="text-warning">YouTube Terms of Service</a>. Please review the <a href="https://policies.google.com/privacy" target="_blank" class="text-warning">Google Privacy Policy</a> to understand how Google handles your data.
privacy.section5.title=5. Data Retention
privacy.section5.item1=Song requests: stored for the duration of the party session
privacy.section5.item2=YouTube search cache: automatically deleted after 30 days
privacy.section5.item3=DJ account data: stored until the DJ deletes their account
privacy.section6.title=6. Data Sharing
privacy.section6.text=We do not sell or share your personal data with third parties. Data is only sent to Google (YouTube API, OAuth), Spotify (if connected), and Google Gemini (AI song evaluation) as required for the service to function.
privacy.section7.title=7. Your Rights \u2014 Data Deletion
privacy.section7.text=You can delete all your data at any time by clicking <strong>"Delete Account"</strong> in your DJ Dashboard. This permanently removes your party settings, song request history, and feedback. You may also revoke Scan2Play's access from your <a href="https://myaccount.google.com/permissions" target="_blank" class="text-warning">Google Account settings</a>.
privacy.section8.title=8. Contact
privacy.section8.text=For questions about this Privacy Policy, please contact us at: <strong>contact@scan2play.com.pl</strong>

