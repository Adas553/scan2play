# Landing Page (landing.html) - Public Home
# ==============================================================================
landing.hero.title=Scan2Play - Your Virtual DJ Assistant
landing.hero.subtitle=Let your guests request music via QR code, while AI ensures the perfect party vibe.
landing.badge.requests=\uD83C\uDFA7 For DJs
landing.btn.start.requests=Collect guest requests
landing.hint.requests=Requires a Google account
