# --- How It Works (Landing Page Guide) ---
landing.guide.title=How does it work?
landing.guide.step1.title=Choose Your Music Engine
landing.guide.step1.text=Pick your playback provider for the night. <strong>Spotify</strong> pushes songs straight to your Spotify queue. <strong>YouTube</strong> plays music videos in our built-in dashboard player. This choice is locked for the entire session.
landing.guide.step2.title=Set the Vibe & Limits
landing.guide.step2.text=Pick a <strong>Global Vibe</strong> (e.g. Retro 80s, Club & EDM) \u2014 our AI will reject songs that don\u2019t match. Set <strong>request limits</strong> per guest and <strong>duplicate memory</strong> to keep the queue fresh.
landing.guide.step3.title=Share the QR Code
landing.guide.step3.text=Your dashboard generates a unique <strong>QR code</strong>. Display it on a screen, laptop, or print it out. Guests scan it with their phone \u2014 no app needed!
landing.guide.step4.title=Manage the Queue
landing.guide.step4.text=All AI-approved requests land on your dashboard. Enable <strong>Auto-Pilot</strong> to let the system play songs automatically, or stay in <strong>Manual</strong> mode for full control. You can also set a <strong>Fallback Playlist</strong> \u2014 paste a YouTube playlist URL and it will play in the background whenever the guest queue is empty. Toggle <strong>Shuffle</strong> to randomize the order.
landing.guide.step5.title=Enjoy the Party!
landing.guide.step5.text=Focus on the crowd and mixing. Scan2Play handles song selection and request management. No more people approaching the booth asking: \u201CCan you play this?\u201D

