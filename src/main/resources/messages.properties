landing.btn.panel=Go to your panel
landing.hint.requests=Requires a Google account
# The landing page (2026-10-17): the app on a laptop and a phone, three steps, what one gets, for whom, the questions
landing.hero.title=Guests request songs. AI keeps the vibe. You play.
landing.hero.subtitle=Guests scan a QR code and type a song on their phone \u2014 nothing to install. The AI turns down what does not fit the party, and you see a ready queue with votes and play from your own software.
landing.hero.free=Free. No card, nothing to install.
landing.hero.alt.dashboard=The DJ\u2019s panel on a laptop: the queue of requests with votes, the guests\u2019 words and dedications and the AI\u2019s comments (a sample party)
landing.hero.alt.guest=The guest\u2019s page on a phone: the field for a song with a dedication and the other guests\u2019 requests with votes (a sample party)
landing.steps.title=How it works
landing.step1.title=Start a party
landing.step1.text=Log in with Google, pick the vibe and print the QR code \u2014 a poster or cards for the tables.
landing.step2.title=Guests scan and request
landing.step2.text=With their phone, no app. They type the artist and the title and give \uD83D\uDC4D to other guests\u2019 songs. They know at once whether the request went through.
landing.step3.title=You play from the queue
landing.step3.text=The AI lets through only what fits. The queue is on your laptop or phone: \u201CCopy\u201D pastes the song into your software\u2019s search, \u201CPlayed\u201D ticks it off.
landing.features.title=What you get
landing.feature.vibe.title=The AI keeps the vibe
landing.feature.vibe.text=The AI checks every request against the vibe and your notes about the party, turns down what has played tonight, and answers the guest with a short comment, like a DJ.
landing.feature.words.title=You see what the guest asked for
landing.feature.words.text=Their words are under the song. When the AI may have got it wrong, the song is marked \u201C\u26A0 Check\u201D.
landing.feature.votes.title=The room\u2019s votes
landing.feature.votes.text=The same song is one row with its votes. You see at once what the dance floor wants.
landing.feature.dedications.title=Dedications
landing.feature.dedications.text=A guest can add a dedication to the song \u2014 \u201Cfor Anna on her 18th\u201D. Only you see it, and the AI keeps the offensive ones out.
landing.feature.hosts.title=The hosts\u2019 list
landing.feature.hosts.text=The hosts write, by a link, what must be played and what must not. The banned songs drop out by themselves.
landing.feature.phone.title=Your phone and your team
landing.feature.phone.text=A notification of every new request on your phone. A second DJ or the bartender helps from their own account.
landing.who.title=Who it is for
landing.who.wedding.title=Wedding DJs
landing.who.wedding.text=Guests stop coming to the booth every minute, and the couple\u2019s list is at hand.
landing.who.club.title=Clubs and parties
landing.who.club.text=The room votes, and the AI sticks to your genre.
landing.who.pub.title=Pubs and bars
landing.who.pub.text=A QR code on the tables, the queue on the bartender\u2019s phone, limits against spam.
landing.who.karaoke.title=Karaoke
landing.who.karaoke.text=Guests sign up songs to sing, and you see the queue with numbers.
forWhom.breadcrumb=You are here
forWhom.faq.title=Questions
forWhom.others.title=Who else it is for
forWhom.home=Scan2Play home page
forWhom.back=\u2190 Back to the home page
forWhom.wedding.seo.title=Wedding song requests by QR code \u2013 Scan2Play for DJs
forWhom.wedding.seo.description=Wedding guests request songs from their phones, and the AI keeps the vibe, turning away what doesn\u2019t fit. No walking up to the booth. Free, nothing to install.
forWhom.wedding.icon=\uD83D\uDC8D
forWhom.wedding.steps.title=How it goes at a wedding
forWhom.wedding.features.title=What helps at a wedding
forWhom.wedding.title=A wedding without a queue at the booth
forWhom.wedding.lede=Guests scan the QR code on their table and type a song on their phone. You see the requests in one queue, with votes, and play from your own software \u2014 no scraps of paper, no shouting over the music.
forWhom.wedding.step1.title=Before the wedding
forWhom.wedding.step1.text=You start a party, pick the vibe (say, \u201CWedding Classics\u201D or \u201CPop & Dance\u201D) and print a poster with the QR code and cards for the tables.
forWhom.wedding.step2.title=The couple add their lists
forWhom.wedding.step2.text=By a link, with no login: the songs that must be played and the ones they do not want.
forWhom.wedding.step3.title=During the party
forWhom.wedding.step3.text=Guests send requests, the AI turns down what does not fit the vibe, and the same song from several guests collects votes.
forWhom.wedding.step4.title=After the wedding
forWhom.wedding.step4.text=Guests see your profiles and can book you for their own party.
forWhom.wedding.feature1.icon=\uD83D\uDC8C
forWhom.wedding.feature1.title=Dedications
forWhom.wedding.feature1.text=\u201CFor Anna on her 18th\u201D: only you see them, and the AI keeps the offensive ones out. You can switch them off.
forWhom.wedding.feature2.icon=\uD83D\uDCFA
forWhom.wedding.feature2.title=A TV screen
forWhom.wedding.feature2.text=The ten most wanted songs and the QR code on the TV in the hall.
forWhom.wedding.feature3.icon=\uD83D\uDD14
forWhom.wedding.feature3.title=Notifications on your phone
forWhom.wedding.feature3.text=A new request reaches you even when the panel is in the background.
forWhom.wedding.feature4.icon=\uD83D\uDCC4
forWhom.wedding.feature4.title=The evening\u2019s summary
forWhom.wedding.feature4.text=What you played and what guests asked for, to download after the party.
forWhom.wedding.faq1.q=Can older guests manage?
forWhom.wedding.faq1.a=All it takes is the phone\u2019s camera: they scan the code and see the field for a song at once. No app, no account.
forWhom.wedding.faq2.q=What if someone asks for disco polo at a rock wedding?
forWhom.wedding.faq2.a=The AI turns down a request that does not fit the vibe you picked and tells the guest why. You still see every request before you play it.
forWhom.wedding.faq3.q=Can guests flood me with requests?
forWhom.wedding.faq3.a=Each guest has a limit of requests and a pause between them, and the same song does not go into the queue twice \u2014 it collects votes.
forWhom.club.seo.title=Club song requests by QR code \u2013 Scan2Play for DJs
forWhom.club.seo.description=Club guests request tracks from their phones and vote for each other\u2019s requests, and the AI turns down what does not fit your genre. Free, nothing to install.
forWhom.club.icon=\uD83C\uDFA7
forWhom.club.steps.title=How it goes in a club
forWhom.club.features.title=What helps in a club
forWhom.club.title=The room says what it wants. The genre stays yours.
forWhom.club.lede=Guests scan a QR code and request tracks from their phones, and the rest of the room votes. The AI sticks to the genre you set, so nothing outside your set gets into the queue.
forWhom.club.step1.title=Before the doors open
forWhom.club.step1.text=You set the vibe (say, \u201CClub & EDM\u201D, \u201CHip-Hop & Rap\u201D, \u201CLatino\u201D) and put the QR code up by the bar and on the screens.
forWhom.club.step2.title=At night
forWhom.club.step2.text=The AI turns down requests outside the genre at once, with a short explanation for the guest.
forWhom.club.step3.title=Votes
forWhom.club.step3.text=Guests give \uD83D\uDC4D to each other\u2019s requests, so you see what the room wants, not only the loudest person at the booth.
forWhom.club.step4.title=You play your way
forWhom.club.step4.text=You decide the order; you mark \u201CPlayed\u201D or \u201CSkip\u201D.
forWhom.club.feature1.icon=\uD83D\uDCFA
forWhom.club.feature1.title=A TV screen
forWhom.club.feature1.text=The most wanted tracks and the QR code on the club\u2019s screens.
forWhom.club.feature2.icon=\uD83D\uDCF1
forWhom.club.feature2.title=The panel on your phone
forWhom.club.feature2.text=The queue fits on a phone by the decks, with notifications of new requests.
forWhom.club.feature3.icon=\u23F1\uFE0F
forWhom.club.feature3.title=Request limits
forWhom.club.feature3.text=You set how many requests one guest may send and how long they wait.
forWhom.club.feature4.icon=\uD83D\uDCAC
forWhom.club.feature4.title=The AI\u2019s comment style
forWhom.club.feature4.text=The guest gets an answer in a tone that suits the club.
forWhom.club.faq1.q=Does Scan2Play play the music?
forWhom.club.faq1.a=No. You play from your own software (rekordbox, Serato, VirtualDJ, djay\u2026). Scan2Play collects and filters the requests.
forWhom.club.faq2.q=On the club\u2019s one Wi-Fi, won\u2019t the limits block everyone?
forWhom.club.faq2.a=The network\u2019s limit is loose, because the whole club is one address; the main limit counts for each guest on their own.
forWhom.club.faq3.q=What if the AI is down?
forWhom.club.faq3.a=The requests come to you unchecked, with a note \u2014 none is lost.
forWhom.pub.seo.title=Song requests in a pub by QR code \u2013 Scan2Play
forWhom.pub.seo.description=A QR code on the tables, song requests on the bartender\u2019s phone, limits against spam. Guests stop coming to the bar about the music. Free, nothing to install.
forWhom.pub.icon=\uD83C\uDF7A
forWhom.pub.steps.title=How it goes in a pub
forWhom.pub.features.title=What helps in a pub
forWhom.pub.title=Music on request, without standing at the bar
forWhom.pub.lede=A QR code on the tables, the guests\u2019 requests on the bartender\u2019s phone. The AI turns down what does not fit the place, and the limits keep one table from taking over the evening.
forWhom.pub.step1.title=To start
forWhom.pub.step1.text=You start a party, pick the vibe (say, \u201CRock & Metal\u201D, \u201CRetro 80s & 90s\u201D, \u201CChillout & Lounge\u201D) and print cards for the tables or put a sheet up by the bar.
forWhom.pub.step2.title=You invite your staff
forWhom.pub.step2.text=The bartender gets an invitation link and logs in with Google; they see the queue and can mark \u201CPlayed\u201D \u2014 only what you allow.
forWhom.pub.step3.title=In the evening
forWhom.pub.step3.text=Guests request from their phones, and the same song from several tables collects votes.
forWhom.pub.step4.title=The next evening
forWhom.pub.step4.text=You reopen the party: the same QR code on the tables keeps working.
forWhom.pub.feature1.icon=\uD83D\uDEE1\uFE0F
forWhom.pub.feature1.title=Limits against spam
forWhom.pub.feature1.text=Requests per guest, a pause between them, no repeats of what played lately.
forWhom.pub.feature2.icon=\uD83D\uDCFA
forWhom.pub.feature2.title=A TV screen
forWhom.pub.feature2.text=The most wanted songs and the QR code on the TV in the place.
forWhom.pub.feature3.icon=\uD83D\uDCB8
forWhom.pub.feature3.title=Tips
forWhom.pub.feature3.text=A guest can leave a tip through your link.
forWhom.pub.feature4.icon=\uD83D\uDD58
forWhom.pub.feature4.title=History
forWhom.pub.feature4.text=What played on the evenings before.
forWhom.pub.faq1.q=Do guests have to log in?
forWhom.pub.faq1.a=No. They scan the code and type. Only the owner and the staff log in.
forWhom.pub.faq2.q=How much does it cost?
forWhom.pub.faq2.a=Nothing. Scan2Play is free \u2014 no card, nothing to install.
forWhom.pub.faq2.a.plans=Free gets you everything a party needs. Pro adds the hosts\u2019 list, your profiles and tips, the evening\u2019s summary and more.
landing.faq.title=Questions
landing.faq.install.q=Do guests have to install anything?
landing.faq.install.a=No. They scan the QR code with their phone\u2019s camera and see the party\u2019s page at once.
landing.faq.player.q=Does Scan2Play play the music?
landing.faq.player.a=No. You play from your own software (VirtualDJ, Serato, rekordbox, djay\u2026). Scan2Play collects and filters the guests\u2019 requests.
landing.faq.price.q=How much does it cost?
landing.faq.price.a=Free gets you everything a party needs. Pro adds the hosts\u2019 list, your profiles and tips, the evening\u2019s summary and more.
landing.faq.price.free=Nothing. Scan2Play is free \u2014 no card, nothing to install.
landing.faq.price.link=See what Pro gives \u2192
landing.faq.ai.q=What if the AI gets it wrong or is down?
landing.faq.ai.a=You see every request before you play it, with the guest\u2019s words, and can skip it. When the AI does not answer, the requests come to you unchecked \u2014 the party loses none.
landing.faq.phone.q=Does it work on the DJ\u2019s phone?
landing.faq.phone.a=Yes. The panel works on a phone and a laptop. You can add it to the Home Screen and get notified of new requests.
landing.faq.data.q=What do you collect about guests?
landing.faq.data.a=Guests make no account and give no e-mail. The DJ sees their requests, and they are deleted after 30 days.
landing.faq.data.link=Privacy policy \u2192
landing.final.title=Ready for your next party?
landing.final.text=You start a party in a minute and get the QR code right away.
landing.error.login=Login failed. Please try again.
landing.staff.summary=Got an invite link from a DJ? Paste it here
landing.staff.label=Paste the invitation link from the party\u2019s organiser
landing.staff.invalid=That link does not work \u2014 ask the organiser for a new one.
landing.staff.guests=That is the guests\u2019 link (\u2026/p/\u2026), not an invitation. An invitation to the staff contains \u201C/join/\u201D \u2014 ask the organiser for one.

