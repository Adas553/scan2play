# --- How It Works (Landing Page Guide) ---
landing.guide.title=How does it work?
landing.guide.step1.title=Start Your Party
landing.guide.step1.text=Log in with your <strong>Google account</strong> and your party is ready. You play from your own software (VirtualDJ, Serato, rekordbox\u2026) \u2014 Scan2Play has no player: it collects and filters the guests\u2019 requests, and you play them.
landing.guide.step2.title=Set the Vibe & Limits
landing.guide.step2.text=Pick the <strong>event vibe</strong> (e.g. Retro 80s & 90s, Club & EDM) \u2014 our AI will reject songs that don\u2019t match. Set <strong>request limits</strong> per guest and <strong>duplicate memory</strong> \u2014 the AI turns down a song that played lately, and more requests for a song already waiting become <strong>votes</strong>.
landing.guide.step3.title=Share the QR Code
landing.guide.step3.text=Your dashboard generates a unique <strong>QR code</strong>. Display it on a screen, laptop, or print it out. Guests scan it with their phone \u2014 no app needed!
landing.guide.step4.title=Manage the Queue
landing.guide.step4.text=All AI-approved requests land on your dashboard \u2014 on a phone too. Tick them off with \u201C\u25B6 Played\u201D or \u201C\u23ED Skip\u201D, <strong>Preview</strong> looks up a song you do not know, and the <strong>Votes</strong> column shows what the room wants most. The <strong>history</strong> keeps what played and what was turned down.
landing.guide.step5.title=Enjoy the Party!
landing.guide.step5.text=Focus on the crowd and mixing. Scan2Play handles song selection and request management. No more people approaching the booth asking: \u201CCan you play this?\u201D

