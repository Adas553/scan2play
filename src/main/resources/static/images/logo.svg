<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Scan2Play">
  <!-- The Scan2Play mark: three finder corners of a QR code ("scan") and a play triangle in the fourth ("play"),
       on the dark tile of the app. -->
  <rect width="64" height="64" rx="14" fill="#1a1a1a"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.5">
    <rect x="9.75" y="9.75" width="16.5" height="16.5" rx="3"/>
    <rect x="37.75" y="9.75" width="16.5" height="16.5" rx="3"/>
    <rect x="9.75" y="37.75" width="16.5" height="16.5" rx="3"/>
  </g>
  <g fill="#ffffff">
    <rect x="15" y="15" width="6" height="6" rx="1"/>
    <rect x="43" y="15" width="6" height="6" rx="1"/>
    <rect x="15" y="43" width="6" height="6" rx="1"/>
  </g>
  <path d="M39 37.5 Q39 35.4 40.9 36.4 L55.4 44.6 Q57.2 46 55.4 47.4 L40.9 55.6 Q39 56.6 39 54.5 Z" fill="#0dcaf0"/>
</svg>
